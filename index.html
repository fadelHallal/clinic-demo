<script>
// Theme: "auto" = light by day (07:00-19:00) and dark at night; or always "light" / "dark".
// The choice is remembered on each device. Re-checked every minute so Auto switches by itself.
(function(){
  var DAY_START = 7, NIGHT_START = 19;
  function mode(){ try{ var m = localStorage.getItem("clinic_theme_mode"); return m==="light"||m==="dark" ? m : "auto"; }catch(e){ return "auto"; } }
  function apply(){
    var m = mode(), h = new Date().getHours(), r = document.documentElement;
    r.dataset.mode = m;
    r.dataset.theme = m!=="auto" ? m : (h >= DAY_START && h < NIGHT_START ? "light" : "dark");
  }
  window.applyTheme = apply;
  apply(); setInterval(apply, 60000);
  document.addEventListener("visibilitychange", function(){ if(!document.hidden) apply(); });
})();
</script>

<style>
:root{
  --bg:#f7f8fa; --card:#ffffff; --border:#e3e6ea; --text:#1c2230; --muted:#6b7280;
  --accent:#2563a8; --accent-soft:#e8f0fb; --danger:#c0392b;
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14181f; --card:#1c222c; --border:#2b3341; --text:#e7ebf3; --muted:#8b93a3;
    --accent:#5b9bdb; --accent-soft:#233246;
  }
}
:root[data-theme="dark"]{
  --bg:#14181f; --card:#1c222c; --border:#2b3341; --text:#e7ebf3; --muted:#8b93a3;
  --accent:#5b9bdb; --accent-soft:#233246;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  min-height:100%;
}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px}
h1{font-size:1.25rem;margin:0}
.sub{color:var(--muted);font-size:.85rem;margin-top:2px}
.tabs{display:flex;gap:6px}
.tab-btn{border:1px solid var(--border);background:var(--card);color:var(--text);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:.85rem}
.tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.nav button{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:8px;padding:6px 10px;cursor:pointer}
.nav .label{font-weight:600}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dow{text-align:center;font-size:.72rem;color:var(--muted);padding:4px 0}
.day{
  aspect-ratio:1;border:1px solid var(--border);border-radius:8px;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  padding:4px 2px;cursor:pointer;font-size:.8rem;position:relative;
}
.day:hover{border-color:var(--accent)}
.day.other{opacity:.35}
.day.today{border-color:var(--accent);font-weight:700}
.day .dot{width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:2px}
.day .n{font-size:.62rem;color:var(--muted)}
.daylist{margin-top:14px}
.slot{
  display:flex;justify-content:space-between;align-items:center;border:1px solid var(--border);
  border-radius:8px;padding:8px 10px;margin-bottom:6px;background:var(--bg);font-size:.88rem;cursor:pointer;
}
.slot .t{font-weight:600;color:var(--accent);min-width:52px}
.slot .p{flex:1;margin-left:8px}
.slot .r{color:var(--muted);font-size:.78rem}
.btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:9px 14px;cursor:pointer;font-size:.88rem}
.btn.secondary{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
.field{margin-bottom:12px}
label{display:block;font-size:.78rem;color:var(--muted);margin-bottom:4px}
input,select,textarea{
  width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:.9rem
}
textarea{resize:vertical;min-height:56px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:50}
@media(min-width:640px){.overlay{align-items:center}}
.modal{background:var(--card);border-radius:14px 14px 0 0;padding:18px;width:100%;max-width:480px;max-height:88vh;overflow-y:auto}
@media(min-width:640px){.modal{border-radius:14px}}
.modal h2{margin:0 0 12px;font-size:1.05rem}
.match{background:var(--accent-soft);border:1px solid var(--accent);border-radius:8px;padding:8px 10px;font-size:.82rem;margin-bottom:10px}
.row{display:flex;gap:8px}
.row .btn{flex:1}
.close{position:absolute;top:10px;right:14px;background:none;border:none;font-size:1.3rem;color:var(--muted);cursor:pointer}
.modal{position:relative}
.empty{text-align:center;color:var(--muted);padding:24px 0;font-size:.85rem}
.patient-list .slot{cursor:pointer}
.loading{text-align:center;padding:30px;color:var(--muted)}

/* mobile fixes */
input:not([type=checkbox]),select{height:38px}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;display:block;min-width:0;line-height:1.2}
input[type=date]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value{text-align:left;min-height:1.2em}
.overlay,.modal{overscroll-behavior:contain}
.modal{-webkit-overflow-scrolling:touch}
body.modal-open{overflow:hidden}
@media(max-width:639px){
  body.modal-open{position:fixed;left:0;right:0;width:100%}
  .overlay{align-items:stretch;background:var(--card)}
  .modal{border-radius:0;max-width:100%;height:100vh;height:100dvh;max-height:none;padding:calc(18px + env(safe-area-inset-top,0px)) 18px calc(28px + env(safe-area-inset-bottom,0px))}
  .close{top:calc(10px + env(safe-area-inset-top,0px))}
}
/* ===== v2 look ===== */
:root{--accent:#2f6fed;--accent-soft:#e6eeff;--up-bg:#e1ecff;--up-fg:#1c4fb5;--now-bg:#ffefc2;--now-fg:#8a5300;--past-bg:#eceef2;--past-fg:#8b92a1;--ok-fg:#14803f;--bad-fg:#c62f2f}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--accent:#6b9bff;--accent-soft:#1d2a47;--up-bg:#203559;--up-fg:#aac6ff;--now-bg:#4d3b0f;--now-fg:#ffd479;--past-bg:#262c37;--past-fg:#7d8598;--ok-fg:#6fdc9a;--bad-fg:#ff8080}}
:root[data-theme="dark"]{--accent:#6b9bff;--accent-soft:#1d2a47;--up-bg:#203559;--up-fg:#aac6ff;--now-bg:#4d3b0f;--now-fg:#ffd479;--past-bg:#262c37;--past-fg:#7d8598;--ok-fg:#6fdc9a;--bad-fg:#ff8080}
body{background:linear-gradient(180deg,var(--accent-soft) 0,var(--bg) 280px) no-repeat,var(--bg)}
.wrap{max-width:1180px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px;border-radius:14px;color:#fff;background:linear-gradient(120deg,#2f6fed,#12b3a8);margin-bottom:12px;box-shadow:0 6px 18px rgba(47,111,237,.25)}
.top h1{font-size:1.2rem}
.top .sub{color:rgba(255,255,255,.88)}
.top .btn.secondary{color:#fff;border-color:rgba(255,255,255,.75)}
.btn.sm{padding:5px 11px;font-size:.78rem}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab-btn{white-space:nowrap;border-radius:999px;padding:8px 16px;font-weight:600;font-size:.86rem}
.tab-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 3px 10px rgba(47,111,237,.35)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.layout.solo{grid-template-columns:minmax(0,1fr)}
.layout main{min-width:0}
#todayPanel{position:sticky;top:12px;padding:14px}
.subrow{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px}
.wgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.wcol{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px;min-height:200px;display:flex;flex-direction:column;gap:6px}
.wcol.today{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.whead{display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.whead b{font-size:1rem;color:var(--text);min-width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%}
.wcol.today .whead b{background:var(--accent);color:#fff}
.chip{border-radius:8px;padding:5px 7px;font-size:.76rem;cursor:pointer;line-height:1.25;border-left:3px solid currentColor}
.chip .ct{font-weight:700;font-size:.7rem}
.chip .cp{float:right;font-weight:700}
.chip .cn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.up,.titem.up{background:var(--up-bg);color:var(--up-fg)}
.chip.now,.titem.now{background:var(--now-bg);color:var(--now-fg)}
.chip.past,.titem.past{background:var(--past-bg);color:var(--past-fg)}
.wadd{margin-top:auto;border:1px dashed var(--border);background:transparent;color:var(--muted);border-radius:8px;cursor:pointer;padding:3px 0;font-size:.78rem}
.wadd:hover{border-color:var(--accent);color:var(--accent)}
.wempty{color:var(--muted);font-size:.75rem;text-align:center;opacity:.6;padding:6px 0}
.tp-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tp-head h2{margin:0;font-size:1.1rem}
.tp-count{font-weight:700;font-size:1.05rem;color:var(--accent)}
.tp-count small{font-weight:400;color:var(--muted)}
.tp-bar{height:6px;border-radius:99px;background:var(--past-bg);overflow:hidden;margin:8px 0 12px}
.tp-bar i{display:block;height:100%;background:linear-gradient(90deg,#2f6fed,#12b3a8)}
.tp-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.titem{display:flex;gap:10px;align-items:flex-start;border-radius:10px;padding:8px 10px;margin-bottom:6px;cursor:pointer;font-size:.86rem;border-left:3px solid currentColor}
.titem.now{outline:2px solid var(--now-fg)}
.titem .tt{font-weight:700;min-width:44px}
.titem .tt small{display:block;font-weight:400;opacity:.7;font-size:.7rem}
.titem .tn{flex:1;min-width:0}
.titem .tn small{display:block;color:inherit;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:.6rem;font-weight:800;border-radius:6px;padding:1px 6px;margin-left:6px;background:var(--accent);color:#fff;vertical-align:middle}
.ok{color:var(--ok-fg);font-weight:600}
.bad{color:var(--bad-fg);font-weight:600}
.wa,.btn.wabtn{background:#25d366;color:#fff;border:none;border-radius:8px;cursor:pointer}
.wa{padding:4px 9px;font-size:.78rem;align-self:center}
.day{background:var(--card)}
.day .dot{display:none}
.day .n{background:var(--up-bg);color:var(--up-fg);border-radius:8px;padding:0 6px;font-weight:600;margin-top:4px}
.day.today{background:var(--accent);color:#fff;border-color:var(--accent)}
.day.today .n{background:rgba(255,255,255,.25);color:#fff}
@media(max-width:1000px){.layout{grid-template-columns:minmax(0,1fr)}#todayPanel{position:static;order:-1}#tpList{max-height:260px;overflow:auto}}
@media(max-width:760px){.wgrid{grid-template-columns:1fr}.wcol{min-height:0}.whead{justify-content:flex-start;gap:8px}.wadd{margin-top:0;align-self:flex-start;padding:3px 14px}.top{padding:14px}}


.logo{height:1.35em;width:1.35em;vertical-align:-0.28em;margin-right:.35em;background:#fff;border-radius:9999px;padding:3px;box-shadow:0 1px 3px rgba(0,0,0,.18);object-fit:contain}
.login-logo{height:44px;width:44px;background:#fff;border-radius:9999px;padding:5px;box-shadow:0 2px 6px rgba(0,0,0,.15);object-fit:contain;vertical-align:-10px;margin-right:8px}

/* ===== v3: modern + mobile-first ===== */
:root{--shadow:0 1px 2px rgba(16,24,40,.05),0 6px 16px rgba(16,24,40,.06)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--shadow:0 1px 2px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--shadow:0 1px 2px rgba(0,0,0,.4)}
input,select,textarea,button{font-family:inherit}
body{-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.card,.wcol{box-shadow:var(--shadow);border-radius:14px}
.nav button{width:38px;height:38px;padding:0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:1rem}
.nav .label{font-size:1.02rem}
.tab-btn{display:inline-flex;align-items:center;gap:6px}
.tab-btn svg{width:17px;height:17px;flex:none}
.btn{font-weight:600;transition:transform .08s ease,filter .15s}
.btn:active{transform:scale(.97)}
.chip,.titem,.slot{transition:transform .08s ease}
.chip:active,.titem:active,.slot:active{transform:scale(.985)}
.av{width:38px;height:38px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;background:var(--accent-soft);color:var(--accent);margin-right:2px}
.patient-list .slot{background:transparent;border:none;border-bottom:1px solid var(--border);border-radius:0;margin:0;padding:10px 4px}
.patient-list .slot:last-child{border-bottom:none}
.modal > .row:last-child{position:sticky;bottom:-18px;background:var(--card);padding:12px 0 4px;margin-top:8px;border-top:1px solid var(--border)}
.wstrip,.wday,.fab,.mmoney{display:none}
#patientSearch{border-radius:999px;padding-left:16px;background:var(--card)}

@media(max-width:760px){
  html{font-size:15px}                         /* "zoomed-out" feel on phones */
  input,select,textarea{font-size:16px!important} /* stops iPhone auto-zoom when typing */
  .wrap{padding:10px 12px calc(150px + env(safe-area-inset-bottom,0px))}
  .top{padding:10px 14px;border-radius:14px;margin-bottom:10px}
  .top h1{font-size:1.05rem}
  .top .sub{font-size:.74rem}
  /* tabs become an app-style bottom bar */
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;margin:0;gap:0;justify-content:space-around;overflow:visible;
    padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));
    background:color-mix(in srgb,var(--card) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    border-top:1px solid var(--border)}
  .tab-btn{flex:1;flex-direction:column;gap:3px;border:none;background:none;box-shadow:none;border-radius:10px;padding:5px 2px;font-size:.66rem;font-weight:600;color:var(--muted)}
  .tab-btn.active{background:none;border:none;box-shadow:none;color:var(--accent)}
  .tab-btn svg{width:23px;height:23px}
  /* week on phone = day strip + the chosen day's list (no more long scroll) */
  #weekGrid{display:none}
  .wstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-bottom:12px}
  .ws{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:12px;padding:6px 0 7px;
    display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font:inherit}
  .ws span{font-size:.62rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  .ws b{font-size:1rem}
  .ws i{font-style:normal;font-size:.6rem;font-weight:700;min-width:18px;border-radius:99px;padding:0 5px;background:var(--up-bg);color:var(--up-fg)}
  .ws i.z{background:none;color:transparent}
  .ws.today b{color:var(--accent)}
  .ws.sel{background:var(--accent);border-color:var(--accent);box-shadow:0 3px 10px rgba(47,111,237,.35)}
  .ws.sel span,.ws.sel b{color:#fff}
  .ws.sel i{background:rgba(255,255,255,.25);color:#fff}
  .wday{display:block;padding:14px}
  .nav{margin-bottom:10px}
  .subrow{margin-bottom:8px}
  #weekView .subrow{display:none}
  /* the Today card is redundant on phone in Week / Agenda; in Month it goes under the calendar */
  body[data-view="week"] #todayPanel,body[data-view="day"] #todayPanel{display:none!important}
  #todayPanel{order:1!important}
  #tpList{max-height:none}
  #addAppt,#tpAdd{display:none}
  .fab{display:flex;position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:41;width:56px;height:56px;border-radius:18px;border:none;
    align-items:center;justify-content:center;color:#fff;font-size:1.9rem;line-height:1;cursor:pointer;
    background:linear-gradient(135deg,#2f6fed,#12b3a8);box-shadow:0 8px 20px rgba(47,111,237,.4)}
  body[data-view="messages"] .fab,body[data-view="patients"] .fab{display:none}
  .grid{gap:4px}
  .day{border-radius:10px;font-size:.78rem}
  .modal > .row:last-child{bottom:calc(-28px - env(safe-area-inset-bottom,0px));padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
}

/* ===== v4: patient page + files ===== */
.ico{width:16px;height:16px;flex:none}
.linkbtn{background:none;border:none;color:var(--accent);cursor:pointer;padding:0;font:inherit;font-size:.82rem;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:999px;padding:7px 12px;font:inherit;font-size:.8rem;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.pill:hover{border-color:var(--accent)}
.pill.on{background:var(--accent);border-color:var(--accent);color:#fff}
.pill.wa{background:#25d366;border-color:#25d366;color:#fff;padding:7px 12px;font-size:.8rem}
.pp-back{margin:2px 0 10px;display:inline-flex;align-items:center;gap:4px}
.pp-head{display:flex;gap:14px;align-items:flex-start;padding:16px}
.pp-head .av{width:56px;height:56px;font-size:1.15rem}
.pp-name{font-size:1.3rem;font-weight:700;margin:0;line-height:1.2}
.pp-meta{color:var(--muted);font-size:.84rem;margin-top:3px}
.pp-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.allergy{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:10px 12px;border-radius:12px;font-size:.86rem;
  background:color-mix(in srgb,var(--bad-fg) 12%,var(--card));color:var(--bad-fg);border:1px solid color-mix(in srgb,var(--bad-fg) 35%,transparent)}
.allergy b{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em}
.seg{display:flex;gap:4px;background:var(--past-bg);border-radius:12px;padding:4px;margin:14px 0}
.seg button{flex:1;border:none;background:none;padding:8px 6px;border-radius:9px;font:inherit;font-weight:600;font-size:.84rem;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.seg small{font-weight:500;opacity:.7}
.tl{position:relative;padding-left:20px}
.tl:before{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:2px;background:var(--border)}
.tl-item{position:relative;margin-bottom:12px;cursor:pointer}
.tl-item:before{content:"";position:absolute;left:-19px;top:17px;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--bg)}
.tl-item.future:before{background:var(--bg);border:2px solid var(--accent);width:6px;height:6px}
.tl-card{padding:12px 14px}
.tl-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:.8rem;color:var(--muted)}
.tl-top b{color:var(--text);font-size:.92rem;margin-right:6px}
.tl-sec{font-size:.86rem;margin-top:8px;white-space:pre-wrap;word-break:break-word}
.tl-sec span{display:block;font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-bottom:1px}
.tl-files{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tl-files .pill{padding:4px 10px;font-size:.74rem;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.fbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.fbar .pill{padding:5px 11px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.fcard{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--card);display:flex;flex-direction:column;box-shadow:var(--shadow)}
.fthumb{aspect-ratio:4/3;background:var(--past-bg);display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;border:none;padding:0;width:100%}
.fthumb img{width:100%;height:100%;object-fit:cover;display:block}
.fthumb .ico{width:36px;height:36px}
.finfo{padding:8px 10px 10px;font-size:.76rem;color:var(--muted)}
.finfo b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.82rem;color:var(--text)}
.fcat{display:inline-block;font-size:.64rem;font-weight:700;border-radius:6px;padding:1px 6px;background:var(--accent-soft);color:var(--accent);margin:4px 0 2px}
.facts{display:flex;gap:12px;margin-top:6px}
.facts .linkbtn{font-size:.76rem}
.facts .linkbtn.del{color:var(--bad-fg)}
.frow{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:10px;padding:7px 8px;margin-bottom:6px;background:var(--bg);font-size:.84rem;cursor:pointer}
.frow .fi{width:38px;height:38px;border-radius:8px;flex:none;background:var(--past-bg);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--muted)}
.frow .fi img{width:100%;height:100%;object-fit:cover}
.frow .fi .ico{width:20px;height:20px}
.frow .fn{flex:1;min-width:0}
.frow .fn b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.frow .fx{border:none;background:none;color:var(--muted);cursor:pointer;font-size:1.2rem;padding:4px 8px;line-height:1}
.fadd{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
.fadd select{width:auto;flex:1 1 130px;min-width:0;max-width:240px}
.fsetup{font-size:.8rem;color:var(--muted);background:var(--past-bg);border-radius:10px;padding:10px 12px}
.upl{font-size:.78rem;color:var(--muted);margin-top:6px;min-height:1em}
.suggest{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:5;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 10px 30px rgba(16,24,40,.15);overflow:hidden}
.suggest button{display:flex;width:100%;gap:10px;align-items:center;border:none;background:none;padding:8px 10px;text-align:left;cursor:pointer;color:var(--text);font:inherit;font-size:.88rem}
.suggest button:hover,.suggest button:focus{background:var(--accent-soft);outline:none}
.suggest .av{width:30px;height:30px;font-size:.7rem}
.suggest small{display:block;color:var(--muted);font-size:.74rem}
.modal-sub{margin:-8px 0 12px}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);opacity:0;background:#1c2230;color:#fff;padding:10px 16px;border-radius:12px;font-size:.88rem;font-weight:600;z-index:300;transition:opacity .2s,transform .2s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#toast.show{opacity:1;transform:translate(-50%,0)}
body[data-view="patient"] .fab{display:none}
@media(max-width:760px){
  #toast{bottom:calc(88px + env(safe-area-inset-bottom,0px))}
  .pp-head{padding:14px}
  .pp-head .av{width:48px;height:48px}
  .fgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
}

/* ===== v5: themes + modern look ===== */
:root{--bg:#f7f8fa;--card:#ffffff;--border:#e3e6ea;--text:#1c2230;--muted:#636b78;--accent:#2f6fed;--accent-soft:#e6eeff;--on-accent:#ffffff;--brand:#2f6fed;--grad:linear-gradient(120deg,#2f6fed,#12b3a8);--up-bg:#e1ecff;--up-fg:#1c4fb5;--now-bg:#ffefc2;--now-fg:#8a5300;--ok-fg:#14803f;--bad-fg:#c62f2f;--danger:#c62f2f;--shadow:0 1px 2px rgba(16,24,40,.05),0 4px 14px rgba(16,24,40,.05)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#14181f;--card:#1c222c;--border:#2b3341;--text:#e7ebf3;--muted:#8b93a3;--accent:#6b9bff;--accent-soft:#1d2a47;--on-accent:#0b1530;--brand:#1f4fb8;--grad:linear-gradient(120deg,#1f4fb8,#0e8a82);--up-bg:#203559;--up-fg:#aac6ff;--now-bg:#4d3b0f;--now-fg:#ffd479;--ok-fg:#6fdc9a;--bad-fg:#ff8080;--danger:#ff8080;--shadow:0 1px 2px rgba(0,0,0,.45)}}
:root[data-theme="dark"]{--bg:#14181f;--card:#1c222c;--border:#2b3341;--text:#e7ebf3;--muted:#8b93a3;--accent:#6b9bff;--accent-soft:#1d2a47;--on-accent:#0b1530;--brand:#1f4fb8;--grad:linear-gradient(120deg,#1f4fb8,#0e8a82);--up-bg:#203559;--up-fg:#aac6ff;--now-bg:#4d3b0f;--now-fg:#ffd479;--ok-fg:#6fdc9a;--bad-fg:#ff8080;--danger:#ff8080;--shadow:0 1px 2px rgba(0,0,0,.45)}
:root{--past-bg:color-mix(in srgb,var(--text) 6%,var(--card));--past-fg:var(--muted)}
body{background:linear-gradient(180deg,var(--accent-soft) 0,var(--bg) 280px) no-repeat,var(--bg);font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;letter-spacing:-.005em}
h1,h2,.nav .label,.pp-name{letter-spacing:-.02em}
.top{background:var(--grad);box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 25%,transparent)}
.top-actions{display:flex;gap:8px;align-items:center}
.btn{color:var(--on-accent)}
.btn.secondary{color:var(--accent);border-color:var(--accent)}
.btn.danger{color:var(--bad-fg);border-color:var(--bad-fg)}
.top .btn.secondary{color:#fff;border-color:rgba(255,255,255,.6);background:transparent}
.top .btn.secondary:hover{background:rgba(255,255,255,.12)}
.icon-only{padding:5px 8px;display:inline-flex;align-items:center}
.tp-bar i{background:linear-gradient(90deg,#2f6fed,#12b3a8)}
.tag,.pill.on,.wcol.today .whead b,.day.today{color:var(--on-accent)}
.day.today .n{color:var(--on-accent)}
.card{border-color:var(--border)}
.wcol{border-radius:14px}
.chip{border-left-width:3px;border-radius:8px}
.titem{border-radius:12px}
.nav button{background:var(--card);box-shadow:var(--shadow)}
.nav button:hover{border-color:var(--accent);color:var(--accent)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.modal{box-shadow:0 20px 60px rgba(0,0,0,.25)}
.overlay{backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
/* loading placeholders */
.skel{border-radius:10px;background:linear-gradient(90deg,var(--past-bg) 25%,color-mix(in srgb,var(--past-bg) 40%,var(--card)) 50%,var(--past-bg) 75%);background-size:200% 100%;animation:skel 1.3s linear infinite}
@keyframes skel{to{background-position:-200% 0}}
@media (prefers-reduced-motion: reduce){.skel{animation:none}}
/* tablet / desktop tabs */
@media(min-width:761px){
  .tab-btn.active{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:0 3px 10px color-mix(in srgb,var(--accent) 30%,transparent)}
}
/* demo language switch in the header */
.lang-sw{display:inline-flex;gap:2px;padding:2px;border-radius:999px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.55)}
.lang-sw button{font:inherit;font-size:.78rem;font-weight:700;color:#fff;background:none;border:none;border-radius:999px;padding:5px 9px;cursor:pointer;line-height:1}
.lang-sw button.on{background:#fff;color:var(--accent)}
.demo-reset{margin-top:6px}
/* note bar: birthdays + app fee + gift ideas (on every page) */
.note-bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;padding:10px 16px;margin-bottom:10px;border-radius:14px;color:#fff;font-size:.9rem;line-height:1.35;background:linear-gradient(110deg,#ff7a18,#ff3d77 55%,#b33dff);box-shadow:0 6px 18px rgba(255,61,119,.3)}
.note-bar[hidden]{display:none}
.note-bar b{font-weight:750}
.note-bar .nb-fee{background:rgba(0,0,0,.18);padding:3px 10px;border-radius:999px}
.note-bar .nb-gift{cursor:pointer;text-decoration:underline dotted rgba(255,255,255,.7);text-underline-offset:3px}
.note-bar .nb-sep{opacity:.6}
.note-bar .nb-wave{display:inline-block;animation:nbWave 2.4s ease-in-out infinite}
@keyframes nbWave{0%,70%,100%{transform:rotate(0)}80%{transform:rotate(-14deg)}90%{transform:rotate(14deg)}}
@media(prefers-reduced-motion:reduce){.note-bar .nb-wave{animation:none}}
@media(max-width:760px){.note-bar{font-size:.8rem;padding:8px 12px;gap:5px 10px}.note-bar .nb-sep{display:none}}
/* desktop: sidebar navigation */
@media(min-width:1001px){
  .wrap{display:grid;grid-template-columns:230px minmax(0,1fr);grid-template-rows:auto auto auto 1fr;column-gap:28px;max-width:1400px;padding-top:20px}
  .wrap > .note-bar{grid-column:1 / -1;grid-row:1;margin-bottom:14px}
  .wrap > .top{grid-column:1;grid-row:2;flex-direction:column;align-items:flex-start;gap:14px;padding:18px;margin-bottom:14px;align-self:start}
  .wrap > .top h1{font-size:1.02rem;line-height:1.3}
  .wrap > .tabs{grid-column:1;grid-row:3;flex-direction:column;gap:2px;overflow:visible;padding:0;position:sticky;top:20px;align-self:start}
  .wrap > .tabs .tab-btn{justify-content:flex-start;gap:10px;border:none;background:none;box-shadow:none;border-radius:10px;padding:10px 12px;font-size:.92rem;color:var(--muted)}
  .wrap > .tabs .tab-btn:hover{background:var(--card);color:var(--text)}
  .wrap > .tabs .tab-btn.active{background:var(--accent-soft);color:var(--accent);box-shadow:none}
  .wrap > .tabs .tab-btn svg{width:19px;height:19px}
  .wrap > .layout{grid-column:2;grid-row:2 / span 3}
}
@media(min-width:1001px) and (max-width:1439px){
  body[data-view="week"] #todayPanel,body[data-view="month"] #todayPanel{display:none!important}
  .layout{grid-template-columns:minmax(0,1fr)}
  #todayPanel{position:static;order:-1}
  #tpList{max-height:240px;overflow:auto}
}
/* phone */
@media(max-width:760px){
  .fab{background:linear-gradient(135deg,#2f6fed,#12b3a8);color:#fff;box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 40%,transparent)}
  .ws.sel{box-shadow:0 3px 10px color-mix(in srgb,var(--accent) 35%,transparent)}
  .ws.sel span,.ws.sel b{color:var(--on-accent)}
  .ws.sel i{background:color-mix(in srgb,var(--on-accent) 22%,transparent);color:var(--on-accent)}
}

/* ===== v6: richer desktop (stats, hour grid, sidebar tools, month details) ===== */
.stats,.side-extra,.tg{display:none}
#weekView .subrow{display:none}
.ev.up{background:var(--up-bg);color:var(--up-fg)}
.ev.now{background:var(--now-bg);color:var(--now-fg);outline:2px solid var(--now-fg);outline-offset:-1px}
.ev.past{background:var(--past-bg);color:var(--past-fg)}
.day .dl{display:none}
@media(min-width:761px){
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:18px}

  .greet h2{margin:0;font-size:1.5rem;letter-spacing:-.02em}
  .greet span{color:var(--muted);font-size:.9rem}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center;min-width:0;text-align:left;font:inherit;color:var(--text)}
  button.stat{cursor:pointer}
  button.stat:hover{border-color:var(--accent)}
  .stat .si{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent);flex:none}
  .stat .si .ico{width:21px;height:21px}
  .stat .si.amber{background:var(--now-bg);color:var(--now-fg)}
  .stat .si.red{background:color-mix(in srgb,var(--bad-fg) 14%,var(--card));color:var(--bad-fg)}
  .stat .si.green{background:color-mix(in srgb,var(--ok-fg) 14%,var(--card));color:var(--ok-fg)}
  .stat .st{min-width:0}
  .stat{align-items:flex-start}
  .stat .sc{display:block;font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);line-height:1.3}
  .stat .sv{display:block;font-size:1.25rem;font-weight:700;line-height:1.2;margin-top:1px;white-space:nowrap;font-variant-numeric:tabular-nums}
  .stat .sl{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;font-size:.76rem;line-height:1.3;color:var(--muted);margin-top:1px;overflow-wrap:anywhere}
}
@media(min-width:761px) and (max-width:1000px){ .stats{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media(min-width:761px){ .stats .greet{grid-column:1/-1} }
@media(min-width:1001px){
  #weekGrid{display:none}
  .wrap > .tabs{position:static}
  .tg{display:block;background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
  .tg-head,.tg-body{display:grid;grid-template-columns:52px repeat(7,minmax(0,1fr))}
  .tg-head{border-bottom:1px solid var(--border)}
  .tg-dh{padding:10px 4px 8px;text-align:center;cursor:pointer;border-left:1px solid var(--border);border-top:none;border-right:none;border-bottom:none;background:none;font:inherit;color:var(--text)}
  .tg-dh:hover{background:var(--accent-soft)}
  .tg-dh span{display:block;font-size:.66rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
  .tg-dh b{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;font-size:1.05rem;margin:2px 0 1px}
  .tg-dh small{display:block;font-size:.68rem;color:var(--muted)}
  .tg-dh.today b{background:var(--accent);color:var(--on-accent)}
  .tg-dh.today small{color:var(--accent);font-weight:700}
  .tg-hours{position:relative}
  .tg-hours div{position:absolute;right:8px;transform:translateY(-50%);font-size:.68rem;color:var(--muted);font-variant-numeric:tabular-nums}
  .tg-col{position:relative;border-left:1px solid var(--border);cursor:pointer;
    background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(color-mix(in srgb,var(--border) 45%,transparent) 1px,transparent 1px);
    background-size:100% 72px,100% 36px}
  .tg-col.today{background-color:color-mix(in srgb,var(--accent) 5%,transparent)}
  .ev{position:absolute;left:4px;right:4px;border-radius:8px;padding:4px 7px;font-size:.74rem;line-height:1.25;overflow:hidden;cursor:pointer;border-left:3px solid currentColor;z-index:1;box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .ev:hover{z-index:3;box-shadow:0 4px 12px rgba(0,0,0,.14)}
  .ev .et{display:block;font-weight:700;font-size:.66rem;opacity:.85;font-variant-numeric:tabular-nums}
  .ev b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.78rem}
  .ev .er{display:block;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ev .ep{position:absolute;right:6px;top:3px;font-size:.7rem;font-weight:700}
  .ev.short{display:flex;align-items:center;gap:5px;padding:0 7px}
  .ev.short .et{display:inline}
  .ev.short b{display:inline;padding-right:10px}
  .nowline{position:absolute;left:-1px;right:0;height:2px;background:#e5484d;z-index:2;pointer-events:none}
  .nowline:before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:#e5484d}
  .ghost{position:absolute;left:4px;right:4px;border-radius:8px;border:1.5px dashed var(--accent);color:var(--accent);background:var(--accent-soft);font-size:.7rem;font-weight:700;padding:2px 7px;pointer-events:none;z-index:0}
  /* sidebar tools */
  .side-extra{display:flex;flex-direction:column;gap:14px;grid-column:1;grid-row:4;margin-top:18px;align-self:start}
  .side-search{position:relative}
  .side-search input{background:var(--card);border-radius:10px;padding-right:52px;height:40px}
  .side-search kbd{position:absolute;right:8px;top:10px;font:inherit;font-size:.66rem;font-weight:700;color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:1px 6px;background:var(--bg);pointer-events:none}
  .side-search .suggest{top:calc(100% + 6px)}
  .mini{padding:12px}
  .mini-h{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:.86rem;margin-bottom:8px}
  .mini-h button{border:none;background:none;color:var(--muted);cursor:pointer;font-size:1.1rem;width:28px;height:28px;border-radius:8px}
  .mini-h button:hover{background:var(--accent-soft);color:var(--accent)}
  .mini-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;text-align:center}
  .mini-g span{font-size:.62rem;color:var(--muted);font-weight:700;padding-bottom:4px}
  .mini-g button{border:none;background:none;color:var(--text);font:inherit;font-size:.74rem;height:27px;border-radius:7px;cursor:pointer;position:relative;padding:0}
  .mini-g button:hover{background:var(--accent-soft)}
  .mini-g button.o{color:var(--muted);opacity:.55}
  .mini-g button.inweek{background:var(--accent-soft);border-radius:0}
  .mini-g button.t{background:var(--accent);color:var(--on-accent);font-weight:700;border-radius:7px}
  .mini-g button.has:after{content:"";position:absolute;left:50%;bottom:2px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent)}
  .mini-g button.t.has:after{background:var(--on-accent)}
  .side-legend{display:flex;flex-direction:column;gap:6px;font-size:.76rem;color:var(--muted);padding:0 4px}
  .side-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;vertical-align:-1px}
  /* month: show who is booked */
  .grid{grid-template-columns:repeat(7,minmax(0,1fr))}
  #monthGrid .day{min-width:0;aspect-ratio:auto;min-height:108px;align-items:stretch;padding:6px;font-size:.8rem}
  #monthGrid .day .n{display:none}
  #monthGrid .day .dn{font-weight:700;padding:0 2px}
  #monthGrid .day .dl{display:flex;flex-direction:column;gap:2px;margin-top:4px;min-width:0}
  .dl i{font-style:normal;font-size:.67rem;border-radius:5px;padding:1px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--up-bg);color:var(--up-fg);text-align:left}
  .dl i.past{background:var(--past-bg);color:var(--past-fg)}
  .dl em{font-style:normal;font-size:.66rem;color:var(--muted);padding-left:4px;text-align:left}
  .day.today .dl i,.day.today .dl em{background:color-mix(in srgb,var(--on-accent) 18%,transparent);color:var(--on-accent)}
}

.app-foot{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:32px 12px 8px;text-align:center}

.foot-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:999px;padding:9px 16px;font:inherit;font-size:.85rem;font-weight:600;cursor:pointer;box-shadow:var(--shadow)}

/* ===== summary cards in Month and Agenda ===== */

#dayRevenue{display:none}

}
/* ===== appointment counts in week / month headers ===== */

.whead small.wn{margin-left:auto;font-size:.66rem;font-weight:700;border-radius:99px;padding:1px 7px;background:var(--up-bg);color:var(--up-fg);letter-spacing:0;text-transform:none}

/* ===== K by payer ===== */
.payer-bar{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 12px}

.hosp-total{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.hosp-total:empty{display:none}
.hosp-total .lbl{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}

.payer-pill{font:inherit;color:var(--text);cursor:pointer;display:inline-flex;align-items:baseline;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:999px;padding:6px 12px;font-size:.84rem;box-shadow:var(--shadow)}

.payer-pill span{color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
.payer-pill.none{opacity:.75}
.payer-pill:hover{border-color:var(--accent)}

/* ===== date picker (weeks start on Monday; replaces the phone's own picker) ===== */
.dpick{cursor:pointer}
.dpick input{pointer-events:none;width:100%}
#dpRoot .overlay{z-index:60}
.dp-h{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin:4px 34px 10px 0}
.dp-h button{border:1px solid var(--border);background:var(--card);color:var(--text);width:40px;height:40px;border-radius:12px;font-size:1.2rem;cursor:pointer}
.dp-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.dp-g span{font-size:.7rem;color:var(--muted);font-weight:700;padding-bottom:4px}
.dp-g button{border:none;background:none;color:var(--text);font:inherit;font-size:.95rem;height:42px;border-radius:10px;cursor:pointer;font-variant-numeric:tabular-nums}
.dp-g button:hover{background:var(--accent-soft)}
.dp-g button.today{box-shadow:inset 0 0 0 1.5px var(--accent);color:var(--accent);font-weight:700}
.dp-g button.sel{background:var(--accent);color:#fff;font-weight:700}
.dp-foot{display:flex;gap:8px;margin-top:12px}
.dp-foot .btn{flex:1}

/* ===== phone: Week / Month / Agenda share one "Calendar" tab, with a switch at the top ===== */
.tab-cal,.calseg{display:none}
@media(max-width:760px){
  .tabs .tab-cal{display:flex}

  body[data-view="week"] .calseg,body[data-view="month"] .calseg,body[data-view="day"] .calseg{display:flex;margin:0 0 10px}
}

/* ===== finance ===== */
#financeView{max-width:640px}
:root{--s0:#a3a6ad;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--s0:#5b616c;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181} }
:root[data-theme="dark"]{--s0:#5b616c;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181}
#finCharts{display:grid;gap:12px;margin-bottom:12px}
.fdn{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px}
.fdn-t{font-weight:800;font-size:.8rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.fdn-body{display:flex;align-items:center;gap:14px}
.fdn-svg{width:132px;height:132px;flex:none}
.fdn-seg{cursor:pointer;transition:opacity .15s}.fdn-seg.dim,.fdn-row.dim{opacity:.3}
.fdn-c1{font-size:15px;font-weight:700;fill:var(--text);font-variant-numeric:tabular-nums}
.fdn-c2{font-size:9.5px;fill:var(--muted)}
.fdn-leg{flex:1;min-width:0;display:grid;gap:2px}
.fdn-row{display:flex;align-items:center;gap:7px;border:none;background:none;color:var(--text);font:inherit;font-size:.82rem;padding:4px 2px;cursor:pointer;text-align:left;border-radius:6px;transition:opacity .15s}
.fdn-row i{width:10px;height:10px;border-radius:3px;flex:none}
.fdn-row span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fdn-row b{font-variant-numeric:tabular-nums;font-weight:600}
.fdn-row small{width:34px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
@media(max-width:760px){ .fdn{padding:12px 10px} .fdn-body{gap:8px} .fdn-svg{width:108px;height:108px} .fdn-row{font-size:.76rem;gap:5px;padding:3px 0} .fdn-row small{width:28px} }
@media(min-width:761px){ #financeView{max-width:1000px} #finWrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start} }
.fin-card{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px}
.fin-h{padding:9px 14px;font-weight:800;font-size:.8rem;letter-spacing:.05em;text-transform:uppercase;color:#fff}
.fin-h.in{background:#2f9e44}.fin-h.out{background:#e03131}.fin-h.gain{background:#1c7ed6}
.fin-row{display:flex;align-items:center;gap:8px;padding:7px 14px;border-top:1px solid var(--border);min-height:44px}
.fin-h + .fin-row{border-top:none}
.fin-row > span{flex:1;min-width:0}
.fin-row small{display:block;color:var(--muted);font-size:.7rem}
.fin-row b{font-variant-numeric:tabular-nums}
.fin-row.auto b{color:var(--muted)}
.fin-row.auto .fin-amt{color:var(--muted)}
.fin-row.auto .fin-amt[data-edited="1"]{color:var(--text)}
.fin-row.carry .fin-amt{color:var(--ok-fg)}
.fin-row.tot{background:var(--past-bg);font-weight:700}
.fin-row.tot b{font-size:1.05rem}
#finLeft,#finCarry{color:var(--ok-fg)}#finLeft.neg{color:var(--bad-fg)}
.fin-name{flex:1;min-width:0;border:none;background:transparent;color:var(--text);font:inherit;padding:6px 0}
.fin-amt{width:118px;flex:none;text-align:right;border:1px solid var(--border);border-radius:9px;background:var(--bg);color:var(--text);font:inherit;font-weight:600;padding:7px 9px;font-variant-numeric:tabular-nums}
.fin-amt::placeholder{font-weight:400;font-size:.72rem}
.fin-paid{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--border);background:none;color:transparent;font-size:.8rem;font-weight:800;cursor:pointer;padding:0;line-height:1}
.fin-paid.on{background:var(--ok-fg);border-color:var(--ok-fg);color:var(--card)}
.fin-row.unpaid b{color:var(--now-fg)}
.fin-x{width:26px;flex:none;border:none;background:none;color:var(--muted);font-size:1.2rem;cursor:pointer;padding:0}
.fin-fam{flex:none;border:1px solid var(--border);background:none;color:var(--muted);border-radius:999px;font:inherit;font-size:.68rem;font-weight:700;padding:4px 8px;cursor:pointer}
.fin-fam.on{background:var(--free);border-color:var(--free);color:#fff}
.fin-add{display:block;width:100%;border:none;border-top:1px dashed var(--border);background:none;color:var(--accent);font:inherit;font-weight:700;padding:11px 14px;text-align:left;cursor:pointer}
body[data-view="finance"] .fab{display:none}
.top-msg{display:none}
@media(max-width:760px){ .tabs .tab-btn[data-view="messages"]{display:none} .top-msg{display:inline-flex}
  /* keep the name and the 3 header buttons on one line */
  .top{flex-wrap:nowrap;gap:8px;padding:10px 12px} .top > :first-child{min-width:0} .top h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .top-actions{gap:6px;flex:none} .top .icon-only{padding:5px 7px} #logoutBtn{padding-left:9px;padding-right:9px} }

/* ===== clinics (paid per patient) ===== */
#clinMode{margin:0 0 10px}
.stats.kpis.clin-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
#clinicsView .nav{margin-bottom:10px}
.stepper{display:flex;gap:8px;align-items:center}
.stepper .btn{width:48px;flex:none;padding:10px 0;font-size:1.2rem;line-height:1}
.stepper input{flex:1;text-align:center;font-size:1.1rem;font-weight:700}
.clin-calc{margin:-4px 0 12px;color:var(--muted);font-variant-numeric:tabular-nums}
.clin-calc:empty{display:none}
.clin-calc b{color:var(--ok-fg);font-size:1.05rem}
#clinList .inc-day:first-child{margin-top:4px}

/* ===== UX pass: quick pay, form sections ===== */
.qpay{align-self:center;border:1.5px solid var(--ok-fg);background:transparent;color:var(--ok-fg);border-radius:999px;padding:6px 10px;font:inherit;font-size:.78rem;font-weight:700;cursor:pointer;white-space:nowrap}
.qpay:active{transform:scale(.96)}
.fsec{margin:18px 0 8px;padding-top:12px;border-top:1px solid var(--border);font-size:.7rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
.modal h2 + .fsec,.modal .modal-sub + .fsec{border-top:none;padding-top:0;margin-top:4px}
.paymode{margin:0}
.paymode button.on[data-paid="1"]{color:var(--ok-fg)}
.qp-amts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.qp-amt{height:56px;border-radius:14px;border:1px solid var(--border);background:var(--bg);color:var(--ok-fg);font:inherit;font-size:1.3rem;font-weight:800;cursor:pointer}
.qp-amt:active{transform:scale(.97);border-color:var(--ok-fg)}
@media(max-width:639px){
  .overlay.sheet-ov{align-items:flex-end!important;background:rgba(0,0,0,.45)!important}
  .modal.sheet{height:auto!important;max-height:85vh;border-radius:20px 20px 0 0!important;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))!important}
}
</style>
</head>

// [regex, French, Arabic]: a replacement string ($1…) or a function (m, t) where t() translates a part.
const __plS = n => (+n === 1 ? "" : "s");
const I18N_PATTERNS = [

  [/^(\d+) visits?$/, m => `${m[1]} consultation${__plS(m[1])}`, m => `الزيارات: ${m[1]}`],

  [/^(\d+) left$/, m => `${m[1]} restant${__plS(m[1])}`, m => `بقي ${m[1]}`],

  [/^\+(\d+) more$/, m => `+${m[1]} autres`, m => `+${m[1]} أخرى`],
  [/^(.+) collected$/, m => `${m[1]} encaissés`, m => `تم تحصيل ${m[1]}`],
  [/^(.+) (\$[\d.,]+)$/, (m,t) => `${t(m[1])} ${m[2]}`, (m,t) => `${t(m[1])} ${m[2]}`],

// DEMO ONLY: French / Arabic / English switch. The app itself is written in English; this layer
// swaps every piece of text on screen (and placeholders, tooltips, alerts) using I18N_DICT and
// I18N_PATTERNS from i18n-dict.js. Arabic also turns the page right-to-left. Dates follow __LOC.
(function(){
  let L = "fr";
  try{ L = localStorage.getItem("demo_lang") || "fr"; }catch(e){}
  if(!["fr","ar","en"].includes(L)) L = "fr";
  window.__LANG = L;
  window.__LOC = L==="fr" ? "fr-FR" : L==="ar" ? "ar-LB-u-nu-latn" : "en-US";
  document.documentElement.lang = L;
  if(L==="ar") document.documentElement.dir = "rtl";
  window.__setLang = l => { try{ localStorage.setItem("demo_lang", l); }catch(e){} location.reload(); };
  window.__t = s => s;

  const col = L==="fr" ? 0 : L==="ar" ? 1 : -1;      // English: nothing to translate (only the direction fix below)
  const D = new Map();
  if(col >= 0) Object.entries(I18N_DICT).forEach(([k,v]) => { if(v && v[col]) D.set(k, v[col]); });
  const P = col < 0 ? [] : I18N_PATTERNS.map(p => [p[0], p[col+1]]).filter(p => p[1] !== undefined);
  // Lines mixing Arabic and Latin parts ("Name · مستشفى …"): keep each part in its own direction
  const AR_RE = /[\u0600-\u06FF]/, LAT_RE = /[A-Za-z]/;
  const isolate = t => (t.includes(" · ") && AR_RE.test(t) && LAT_RE.test(t) && !t.includes("\u2068"))
    ? t.split(" · ").map(x => x.trim() ? "\u2068" + x + "\u2069" : x).join(" · ") : t;

  // exact text, then patterns (counts, dates…), then the parts around " · ", then the label before ": "
  function core(t, depth){
    let out = D.get(t);
    if(out !== undefined) return out;
    for(const [re, rp] of P){
      const m = t.match(re);
      if(m) return typeof rp === "function" ? rp(m, x => core(x, depth+1) ?? x) : t.replace(re, rp);
    }
    if(depth > 3) return undefined;
    if(t.includes(" · ")){
      const parts = t.split(" · "), tp = parts.map(x => x.trim() ? (core(x.trim(), depth+1) ?? x) : x);
      if(tp.some((x,i) => x !== parts[i])) return tp.join(" · ");
    }
    const c = t.indexOf(": ");
    if(c > 0){ const l = core(t.slice(0,c), depth+1); if(l !== undefined) return l + (L==="fr" ? " : " : ": ") + t.slice(c+2); }
    return undefined;
  }
  function tr(str){
    if(typeof str !== "string") return str;
    const t = str.trim(); if(!t) return str;
    const out = core(t, 0);
    return out === undefined ? str : str.replace(t, out);
  }
  window.__t = tr;

  const ATTRS = ["placeholder","title","aria-label"];
  function walk(node){
    if(node.nodeType === 3){
      const p = node.parentNode;
      if(p && p.nodeName === "OPTION" && !p.hasAttribute("value")) p.setAttribute("value", p.textContent); // keep what the code reads
      const v = node.nodeValue, n = isolate(tr(v)); if(n !== v) node.nodeValue = n;
      return;
    }
    if(node.nodeType !== 1) return;
    const tag = node.nodeName;
    if(tag === "SCRIPT" || tag === "STYLE" || tag === "TEXTAREA") return;
    for(const a of ATTRS){ const v = node.getAttribute(a); if(v){ const n = tr(v); if(n !== v) node.setAttribute(a, n); } }
    if(tag === "INPUT" && (node.type === "button" || node.type === "submit") && node.value){ const n = tr(node.value); if(n !== node.value) node.value = n; }
    for(const c of node.childNodes) walk(c);
  }
  const mo = new MutationObserver(ms => {
    for(const m of ms){
      if(m.type === "characterData") walk(m.target);
      else if(m.type === "attributes") { const v = m.target.getAttribute(m.attributeName); if(v){ const n = tr(v); if(n !== v) m.target.setAttribute(m.attributeName, n); } }
      else m.addedNodes.forEach(walk);
    }
  });
  function start(){
    document.title = tr(document.title);
    walk(document.body);
    mo.observe(document.documentElement, {childList:true, subtree:true, characterData:true, attributes:true, attributeFilter:ATTRS});
  }
  if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", start); else start();

  // messages in pop-ups: whole message, else line by line
  const msg = m => { if(typeof m !== "string") return m; const w = tr(m); return w !== m ? w : m.split("\n").map(tr).join("\n"); };
  const A = window.alert.bind(window), C = window.confirm.bind(window), Pr = window.prompt.bind(window);
  window.alert = m => A(msg(m));
  window.confirm = m => C(msg(m));
  window.prompt = (m, d) => Pr(msg(m), d);
})();

</script>
<script>
// DEMO ONLY: a pretend clinic server that runs inside the browser.
// Every call the app makes to /api/... is answered here from fake data kept in this browser
// (localStorage). Nothing is sent anywhere; each visitor has their own copy. "Reset demo" starts over.
(function(){
  // one set of fake data per language (the cardiology demo can switch French / Arabic / English)
  const KEY = "clinic_demo_db_v3" + (window.__LANG && window.__LANG !== "en" ? "_" + window.__LANG : "");
  let S = null;

  // fake login so the demo opens straight away (any email/password works after Sign out)
  const fakeToken = () => "demo." + btoa(JSON.stringify({exp: Math.floor(Date.now()/1000) + 90*86400})) + ".demo";
  try{
    if(!localStorage.getItem("clinic_pb_session"))
      localStorage.setItem("clinic_pb_session", JSON.stringify({token: fakeToken(), expires_at: Date.now()+90*86400000, refreshed_at: Date.now()}));
  }catch(e){}

  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(S)); }
    catch(e){ try{ localStorage.setItem(KEY, JSON.stringify({...S, files:{}})); }catch(e2){} } // too big: keep data, drop file contents
  }
  function load(){
    if(S) return;
    try{ S = JSON.parse(localStorage.getItem(KEY) || "null"); }catch(e){ S = null; }
    if(!S || !S.t){ S = seed(); save(); }
  }
  window.__demoReset = function(){
    if(!confirm("Start the demo again with fresh fake data?\n\nEverything you added in the demo will be removed.")) return;
    try{ localStorage.removeItem(KEY); }catch(e){}
    location.reload();
  };
  window.__demoFile = function(id){ load(); return (S.files && S.files[id]) || ""; };

  // ---------- fake data, built around today's date so the demo always looks current ----------
  function seed(){
    let r = 20261124;
    const rnd = () => (r = (r*1103515245 + 12345) % 2147483648) / 2147483648;
    const pick = a => a[Math.floor(rnd()*a.length)];
    const id = () => { let s = ""; for(let i=0;i<15;i++) s += "abcdefghijklmnopqrstuvwxyz0123456789"[Math.floor(rnd()*36)]; return s; };
    const pad = n => String(n).padStart(2,"0");
    const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
    const today = new Date(); today.setHours(0,0,0,0);
    const addDays = n => { const d = new Date(today); d.setDate(d.getDate()+n); return d; };
    const T = x => (window.__t ? window.__t(x) : x);   // fake text in the chosen language
    const AR = window.__LANG === "ar", FR = window.__LANG === "fr";
    const t = {patients:[], appointments:[], attachments:[], procedures:[], clinic_days:[], finance_months:[]};

    const firstAr = ["علي","حسن","محمد","حسين","أحمد","رامي","كريم","عمر","فادي","جورج","إيلي","طوني","زياد","سمير","وليد","نبيل",
                   "فاطمة","زينب","مريم","رنا","هبة","ليال","نور","سارة","ريما","منى","جويل","كارلا","نادين","لينا","ياسمين","آية"];
    const lastAr = ["حداد","خوري","صالح","ناصر","حمدان","فرحات","منصور","ضاهر","خليل","يونس","رزق","عون","سعد","شاهين",
                    "غصن","حجازي","مراد","ثابت","زين","بركات","سليمان","عيسى","فقيه","موسى"];
    const first = AR ? firstAr : ["Ali","Hassan","Mohammad","Hussein","Ahmad","Rami","Karim","Omar","Fadi","Georges","Elie","Tony","Ziad","Samir","Walid","Nabil",
                   "Fatima","Zeinab","Maryam","Rana","Hiba","Layal","Nour","Sara","Rima","Mona","Joelle","Carla","Nadine","Lina","Yasmine","Aya"];
    const last = AR ? lastAr : ["Haddad","Khoury","Saleh","Nasser","Hamdan","Farhat","Mansour","Daher","Khalil","Younes","Rizk","Aoun","Saad","Chahine",
                  "Ghosn","Hijazi","Mrad","Tabet","Zein","Barakat","Sleiman","Issa","Fakih","Moussa"];
    const names = new Set();
    const tag = AR ? " (تجريبي)" : FR ? " (démo)" : " (demo)";
    while(names.size < 42) names.add(pick(first)+" "+pick(last)+tag);
    [...names].forEach((name,i) => {
      const y = 1945 + Math.floor(rnd()*65);
      t.patients.push({id:id(), name, phone:"+961 00 000 "+String(100+i), dob:y+"-"+pad(1+Math.floor(rnd()*12))+"-"+pad(1+Math.floor(rnd()*28)),
        address:T(pick(["Saida","Nabatieh","Tyre","Jezzine","Beirut","Ghazieh","Marjayoun"])), notes:rnd()<.3 ? T("Fake demo patient.") : "",
        allergies:rnd()<.15 ? T(pick(["Penicillin","Sulfa","Latex"])) : "", created_at:addDays(-70+i).getTime()});
    });

    const CARDIO = window.DEMO_PROFILE === "cardio";
    const reasons = CARDIO ? ["Check-up","Chest pain","Shortness of breath","Palpitations","High blood pressure","Follow-up after stent","Dizziness","Leg swelling","Pre-operative assessment","Cholesterol follow-up"] : ["Check-up","Blurry vision","Glasses prescription","Red eye","Eye pressure follow-up","Diabetic eye exam","After cataract surgery","Dry eyes","Headache when reading","Floaters"];
    const treatments = CARDIO ? ["Continue current treatment","Amlodipine 5 mg once a day","Aspirin 100 mg once a day","Atorvastatin 20 mg evening","Bisoprolol 5 mg once a day","Echo requested","Holter 24 h requested","Control in 3 months"] : ["Artificial tears 4x/day","New glasses prescription","Antibiotic drops 1 week","Control in 3 months","Timolol drops evening","Refer for OCT","No treatment needed"];
    const va = ["10/10","9/10","8/10","7/10","6/10","5/10","4/10"];
    const times = ["09:00","09:30","10:00","10:30","11:00","11:30","12:00","14:00","14:30","15:00","15:30","16:00","16:30","17:00"];
    const nowD = new Date(), nowHM = pad(nowD.getHours())+":"+pad(nowD.getMinutes());
    for(let d=-42; d<=14; d++){
      const day = addDays(d), dow = day.getDay();
      if(dow===0) continue;                                  // closed on Sunday
      const n = dow===6 ? 2 : 3 + Math.floor(rnd()*4);
      const slots = [...times].sort(()=>rnd()-.5).slice(0,n).sort();
      slots.forEach(time => {
        const p = pick(t.patients), past = d < 0 || (d===0 && time < nowHM);
        const free = past && rnd()<.12, paid = past && !free;
        const exam = CARDIO ? (past && rnd()<.8 ? {v:{bp:(115+Math.floor(rnd()*45))+"/"+(70+Math.floor(rnd()*25)), hr:String(58+Math.floor(rnd()*40)), wt:String(55+Math.floor(rnd()*50)), spo2:String(94+Math.floor(rnd()*6)), ecg:T(pick(["Sinus rhythm, normal","Sinus rhythm, normal","Sinus rhythm, LVH signs","Atrial fibrillation, controlled rate","Sinus tachycardia"]))}} : null)
                   : past && rnd()<.7 ? {od:{vaUnc:pick(va), vaCor:"10/10", iop:String(12+Math.floor(rnd()*10))},
                                          os:{vaUnc:pick(va), vaCor:"10/10", iop:String(12+Math.floor(rnd()*10))}, ou:{}} : null;
        t.appointments.push({id:id(), patient_id:p.id, patient_name:p.name, date:iso(day), time, duration:30,
          reason:T(pick(reasons)), notes:past && rnd()<.5 ? T("Fake visit note for the demo.") : "", treatment:past ? T(pick(treatments)) : "",
          exam, paid, amount:paid ? pick([40,40,50,30]) : 0, created_at:day.getTime(), updated_at:day.getTime(), reminder_sent_at:0});
      });
    }

    // real hospitals of South Lebanon, written in Arabic in every language (cardiology demo)
    const hospitals = CARDIO ? ["مستشفى حمود الجامعي","مستشفى لبيب الطبي","مستشفى الراعي","مستشفى صيدا الحكومي",
                                "مستشفى نبيه بري الحكومي الجامعي","مستشفى الشيخ راغب حرب الجامعي","مستشفى غندور",
                                "مستشفى جبل عامل","مستشفى حيرام"] : ["SRH","Hammoud Hospital","Labib Medical Center"];
    const payers = (typeof PAYERS!=="undefined") ? PAYERS : ["خاص"];
    for(let d=-60; d<=0; d++){
      const day = addDays(d); if(day.getDay()===0 || rnd()<.55) continue;
      const k = 1 + Math.floor(rnd()*3);
      for(let j=0;j<k;j++){
        const proc = CARDIO ? pick(["Angiography","Angiography","Angioplasty","Pacemaker","Echo","Echo","Stress test","Holter","ECG","CS"])
                            : pick(["Cataract","Cataract","FB","Suture","Examination","Pterygium","CS"]);
        const K = {Cataract:60, FB:10, Suture:pick([20,35]), Examination:7, Pterygium:pick([30,35]), CS:0,
                   Angiography:300, Angioplasty:pick([500,700]), Pacemaker:600, Echo:40, "Stress test":50, Holter:40, ECG:10}[proc];
        t.procedures.push({id:id(), date:iso(day), procedure:proc, patient_name:pick([...names]), hospital:T(pick(hospitals)),
          amount:K, payer:pick(payers), notes:"", created_at:day.getTime()});
      }
    }

    const groups = (typeof CLINIC_GROUPS!=="undefined") ? CLINIC_GROUPS : [];
    const counted = groups.flatMap(g=>g.clinics).filter(c=>c[1]!==null);
    const laser = groups.flatMap(g=>g.clinics).filter(c=>c[1]===null);
    const acts = (typeof LASER_ACTS!=="undefined") ? LASER_ACTS : [];
    for(let d=-75; d<=0; d++){
      const day = addDays(d); if(day.getDay()===0 || rnd()<.35) continue;
      const k = 1 + Math.floor(rnd()*2);
      for(let j=0;j<k;j++){
        if(laser.length && acts.length && rnd()<.15){
          const a = pick(acts);
          t.clinic_days.push({id:id(), date:iso(day), clinic:pick(laser)[0], patients:1, rate:a[1], act:a[0], notes:"", created_at:day.getTime()});
        } else if(counted.length){
          const c = pick(counted);
          t.clinic_days.push({id:id(), date:iso(day), clinic:c[0], patients:4+Math.floor(rnd()*18), rate:c[1], act:"", notes:"", created_at:day.getTime()});
        }
      }
    }

    // one sample file: a drawn "scan" picture on the first patient
    const svg = CARDIO ? ecgSvg() : '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300"><rect width="400" height="300" fill="#111"/>'+
      '<circle cx="200" cy="150" r="110" fill="#7a2b12"/><circle cx="200" cy="150" r="34" fill="#f2c14e"/>'+
      '<path d="M200 150 C120 80 90 120 60 90 M200 150 C280 80 310 130 340 95 M200 150 C130 220 100 200 70 230 M200 150 C270 220 300 200 330 225" stroke="#c0392b" stroke-width="4" fill="none"/>'+
      '<text x="12" y="288" fill="#fff" font-family="sans-serif" font-size="14">Sample fundus photo (demo)</text></svg>';
    const fid = id(), p0 = t.patients[0], fname = CARDIO ? "ecg-sample.svg" : "fundus-sample.svg";
    t.attachments.push({id:fid, patient_id:p0.id, appointment_id:"", name:fname, type:"image/svg+xml", size:svg.length,
      category:CARDIO ? "ECG" : "Scan", file:fname, created_at:Date.now()});
    return {t, files:{[fid]: "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg)}};
  }

  function ecgSvg(){
    let d = "M0 150", x = 0;
    while(x < 400){ d += " L"+(x+20)+" 150 L"+(x+26)+" 140 L"+(x+32)+" 150 L"+(x+40)+" 150 L"+(x+44)+" 165 L"+(x+48)+" 70 L"+(x+52)+" 185 L"+(x+56)+" 150 L"+(x+68)+" 150 L"+(x+78)+" 130 L"+(x+88)+" 150 L"+(x+80+20)+" 150"; x += 100; }
    let grid = ""; for(let i=0;i<=400;i+=20) grid += '<path d="M'+i+' 0V300" stroke="#f6b8b8" stroke-width="'+(i%100?0.5:1.2)+'"/>';
    for(let j=0;j<=300;j+=20) grid += '<path d="M0 '+j+'H400" stroke="#f6b8b8" stroke-width="'+(j%100?0.5:1.2)+'"/>';
    return '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300"><rect width="400" height="300" fill="#fff5f5"/>'+grid+
      '<path d="'+d+'" stroke="#111" stroke-width="2" fill="none"/><text x="10" y="290" fill="#333" font-family="sans-serif" font-size="13">ECG sample, lead II (demo)</text></svg>';
  }

  // ---------- the pretend server ----------
  const realFetch = window.fetch.bind(window);
  const json = (o, status) => new Response(status===204 ? null : JSON.stringify(o), {status: status||200, headers:{"Content-Type":"application/json"}});
  const fileToDataUrl = f => new Promise((ok, no) => { const fr = new FileReader(); fr.onload = () => ok(fr.result); fr.onerror = no; fr.readAsDataURL(f); });
  const newId = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-8);

  window.fetch = async function(input, init){
    const url = typeof input === "string" ? input : input.url;
    let u; try{ u = new URL(url, location.href); }catch(e){ return realFetch(input, init); }
    if(u.origin !== location.origin || !u.pathname.startsWith("/api/")) return realFetch(input, init);
    load();
    init = init || {};
    const method = (init.method || "GET").toUpperCase();
    const path = u.pathname.slice(5);

    if(/^collections\/users\/auth-(with-password|refresh)$/.test(path)) return json({token: fakeToken()});
    if(path === "health") return json({code:200, message:"API is healthy."});
    if(path === "files/token") return json({token:"demo"});

    const m = path.match(/^collections\/([a-z_]+)\/records(?:\/([^/]+))?$/);
    if(!m || !S.t[m[1]]) return json({message:"Not found."}, 404);
    const rows = S.t[m[1]], rid = m[2] ? decodeURIComponent(m[2]) : null;

    if(method === "GET" && !rid){
      const page = Number(u.searchParams.get("page") || 1);
      const items = page > 1 ? [] : [...rows].sort((a,b)=>a.id < b.id ? -1 : 1);
      return json({page, perPage:500, items});
    }
    if(method === "GET"){ const row = rows.find(x=>x.id===rid); return row ? json(row) : json({message:"Not found."}, 404); }

    if(method === "POST" && !rid){
      let o = {};
      if(init.body instanceof FormData){
        for(const [k,v] of init.body.entries()){
          if(v instanceof Blob){ o.file = v.name || "file"; o.__blob = v; } else o[k] = v;
        }
      } else { try{ o = JSON.parse(init.body || "{}"); }catch(e){ return json({message:"Bad request."}, 400); } }
      if(!o.id) o.id = newId();
      if(rows.some(x=>x.id===o.id)) return json({message:"Failed to create record.", data:{id:{message:"The value must be unique."}}}, 400);
      if(o.__blob){ S.files[o.id] = await fileToDataUrl(o.__blob); delete o.__blob; }
      ["size","created_at","updated_at","amount","duration","patients","rate","account"].forEach(k=>{ if(typeof o[k]==="string" && o[k]!=="") o[k] = Number(o[k]); });
      rows.push(o); save();
      return json(o);
    }
    if(method === "PATCH" && rid){
      const row = rows.find(x=>x.id===rid); if(!row) return json({message:"Not found."}, 404);
      let o = {}; try{ o = JSON.parse(init.body || "{}"); }catch(e){}
      Object.assign(row, o); save();
      return json(row);
    }
    if(method === "DELETE" && rid){
      const i = rows.findIndex(x=>x.id===rid); if(i<0) return json({message:"Not found."}, 404);
      rows.splice(i,1); if(S.files) delete S.files[rid]; save();
      return json(null, 204);
    }
    return json({message:"Not supported in the demo."}, 400);
  };
})();

<script>
const DOW = [1,2,3,4,5,6,7].map(i=>new Date(2024,0,i).toLocaleDateString(__LOC,{weekday:"short"}));
let db = null;
let patients = [];
let appts = [];
let selectedDate = new Date();
let currentMonth = new Date();
let view = "week";

function pad(n){return String(n).padStart(2,"0")}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function fmtMonth(d){return d.toLocaleDateString(__LOC,{month:"long",year:"numeric"})}
function fmtDay(d){return d.toLocaleDateString(__LOC,{weekday:"long",day:"numeric",month:"long"})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}


// Address of the clinic server (PocketBase). Leave "" when this page is served by the server itself.
const PB_URL = "";
const API = (PB_URL || location.origin).replace(/\/$/, "");
const COLMAP = {patientId:"patient_id", patientName:"patient_name", createdAt:"created_at", updatedAt:"updated_at", reminderSentAt:"reminder_sent_at"};
const COLREV = Object.fromEntries(Object.entries(COLMAP).map(([k,v])=>[v,k]));
function toDb(o){
  const r = {};
  for(const k in o){
    let v = o[k];
    if(k==="dob" && !v) v = null;
    r[COLMAP[k]||k] = v;
  }
  return r;
}
function fromDb(r){
  const o = {};
  for(const k in r){
    if(k==="id") continue;
    let v = r[k];
    if(v===null) v = (k==="paid") ? false : "";
    if(["amount","duration","created_at","updated_at","reminder_sent_at"].includes(k)) v = Number(v)||0;
    o[COLREV[k]||k] = v;
  }
  return o;
}
async function api(path, opts){
  opts = opts || {};
  const write = (opts.method||"GET") !== "GET";
  const token = await getToken();
  const json = opts.body && !(opts.body instanceof FormData);
  let res;
  try{
    res = await fetch(API+"/api/"+path, {...opts,
      headers:{...(token?{Authorization:token}:{}), ...(json?{"Content-Type":"application/json"}:{}), ...(opts.headers||{})}});
  }catch(e){
    if(write && !opts.quiet) alert("Could not reach the clinic server. Check your internet connection.");
    throw e;
  }
  if(res.status===401 && token){ clearSession(); showLogin(); throw new Error("Session expired. Please sign in again."); }
  if(!res.ok){
    let msg = "HTTP "+res.status;
    try{
      const j = await res.json(); msg = j.message || msg;
      const d = j.data && Object.entries(j.data);
      if(d && d.length) msg += " ("+d.map(([k,v])=>k+": "+((v&&v.message)||v)).join(", ")+")";
    }catch(e){}
    if(write && !opts.quiet) alert("Could not save to the database: "+msg);
    throw new Error(msg);
  }
  return res.status===204 ? null : res.json().catch(()=>null);
}
function cleanRow(r){ const o = {...r}; delete o.collectionId; delete o.collectionName; return o; }
// Read a whole table, 500 rows at a time.
async function fetchAll(table){
  const out = [];
  for(let page = 1; ; page++){
    const r = await api("collections/"+table+"/records?perPage=500&page="+page+"&skipTotal=1&sort=id");
    const items = (r && r.items) || [];
    out.push(...items.map(cleanRow));
    if(items.length < 500) return out;
  }
}
function makeDb(){
  return {
    collection: name => ({
      async get(){
        const rows = await fetchAll(name);
        return {docs:(rows||[]).map(r=>({id:r.id, data:fromDb(r)}))};
      }
    }),
    doc: path => {
      const [table,id] = path.split("/");
      const one = "collections/"+table+"/records/"+encodeURIComponent(id);
      return {
        set: o => api("collections/"+table+"/records", {method:"POST", body:JSON.stringify({id, ...toDb(o)})}),
        update: (o,quiet) => api(one, {method:"PATCH", quiet, body:JSON.stringify(toDb(o))}),
        delete: () => api(one, {method:"DELETE"})
      };
    }
  };
}


const AUTH_KEY = "clinic_pb_session";
let authSession = null;
function saveSession(x){ authSession = x; try{ localStorage.setItem(AUTH_KEY, JSON.stringify(x)); }catch(e){} }
function loadSession(){ try{ return JSON.parse(localStorage.getItem(AUTH_KEY)||"null"); }catch(e){ return null; } }
function clearSession(){ authSession = null; try{ localStorage.removeItem(AUTH_KEY); }catch(e){} }
function sessionFrom(token){
  let exp = Date.now()+3600000;
  try{ exp = JSON.parse(atob(token.split(".")[1].replace(/-/g,"+").replace(/_/g,"/"))).exp*1000; }catch(e){}
  return {token, expires_at:exp, refreshed_at:Date.now()};
}
async function authLogin(email, password){
  const res = await fetch(API+"/api/collections/users/auth-with-password", {
    method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({identity:email, password})
  });
  const j = await res.json().catch(()=>({}));
  if(res.status===400) throw new Error("Wrong email or password.");
  if(res.status===429) throw new Error("Too many attempts. Wait a few seconds and try again.");
  if(!res.ok) throw new Error(j.message || "Login failed");
  return sessionFrom(j.token);
}
async function getToken(){
  if(!authSession) return null;
  if(!authSession.token || Date.now() > authSession.expires_at - 60000){
    clearSession(); showLogin(); throw new Error("Session expired. Please sign in again.");
  }
  // Check the login when the app opens (an invalid login would otherwise just show an empty
  // schedule), then renew it once a day so the doctor stays signed in.
  if(!sessionChecked || Date.now() - (authSession.refreshed_at||0) > 86400000){
    let res = null;
    try{ res = await fetch(API+"/api/collections/users/auth-refresh", {method:"POST", headers:{Authorization:authSession.token}}); }catch(e){}
    if(res && res.ok){ saveSession(sessionFrom((await res.json()).token)); sessionChecked = true; }
    else if(res && [401,403,404].includes(res.status)){ clearSession(); showLogin(); throw new Error("Please sign in again."); }
  }
  return authSession.token;
}
let sessionChecked = false;

async function init(){

async function loadAll(){
  if(!db){ patients=[]; appts=[]; return; }
  try{
    const [pRes,aRes] = await Promise.all([
      db.collection("patients").get(),
      db.collection("appointments").get()
    ]);
    patients = (pRes && pRes.docs) ? pRes.docs.map(d=>({id:d.id,...d.data})) : [];
    appts = (aRes && aRes.docs) ? aRes.docs.map(d=>({id:d.id,...d.data})) : [];
  }catch(e){ patients=[]; appts=[]; throw e; }
}

function toMinutes(t){const[h,m]=t.split(":").map(Number);return h*60+m;}

function findConflicts(date,time,duration,excludeId){
  const start = toMinutes(time);
  const end = start + (Number(duration)||30);
  return appts.filter(a=>{
    if(a.date!==date || a.id===excludeId) return false;
    const s = toMinutes(a.time);
    const e = s + (Number(a.duration)||30);
    return start < e && s < end;
  });
}

function apptsForDate(d){
  const s = iso(d);
  return appts.filter(a=>a.date===s).sort((a,b)=>a.time.localeCompare(b.time));
}

function renderDOW(){
  const row = document.getElementById("dowRow");
  row.innerHTML = DOW.map(d=>`<div class="dow">${d}</div>`).join("");
}

function apptCount(n){ return n===0 ? "No appointments" : n===1 ? "1 appointment" : n+" appointments"; }

function renderMonth(){
  const y0 = currentMonth.getFullYear(), m0 = currentMonth.getMonth();
  const prefix = y0+"-"+pad(m0+1);
  document.getElementById("monthLabel").innerHTML = fmtMonth(currentMonth)
    +'<small class="cnt">'+apptCount(appts.filter(a=>a.date.startsWith(prefix)).length)+'</small>';
  const monthTotal = appts.filter(a=>a.paid && a.date.startsWith(prefix)).reduce((s,a)=>s+(a.amount||0),0);
  document.getElementById("monthRevenue").textContent = "Revenue this month: $"+monthTotal.toFixed(2);
  renderMonthStats(prefix, monthTotal);
  const grid = document.getElementById("monthGrid");
  const y = currentMonth.getFullYear(), m = currentMonth.getMonth();
  const first = new Date(y,m,1);
  let startOffset = (first.getDay()+6)%7; // lundi=0
  const daysInMonth = new Date(y,m+1,0).getDate();
  const today = iso(new Date());
  let html = "";
  for(let i=0;i<startOffset;i++){
    const dd = new Date(y,m,1-(startOffset-i));
    html += dayCell(dd,true,today);
  }
  for(let d=1;d<=daysInMonth;d++){
    const dd = new Date(y,m,d);
    html += dayCell(dd,false,today);
  }
  const cellCount = startOffset+daysInMonth;
  const trailing = (7-(cellCount%7))%7;
  for(let i=1;i<=trailing;i++){
    const dd = new Date(y,m+1,i);
    html += dayCell(dd,true,today);
  }
  grid.innerHTML = html;
  grid.querySelectorAll(".day").forEach(el=>{
    el.addEventListener("click",()=>{
      const [yy,mm,ddd] = el.dataset.date.split("-").map(Number);
      selectedDate = new Date(yy,mm-1,ddd);
      switchView("day");
    });
  });
}

function dayCell(dd,other,today){
  const key = iso(dd);
  const list = apptsForDate(dd), n = list.length;
  const isToday = key===today;
  return `<div class="day ${other?"other":""} ${isToday?"today":""}" data-date="${key}">
    <span class="dn">${dd.getDate()}</span>
    ${n?`<span class="dot"></span><span class="n">${n}</span>`:""}
    ${n?`<div class="dl">${list.slice(0,3).map(a=>`<i class="${apptState(a)==="past"?"past":""}">${a.time} ${escapeHtml(a.patientName)}</i>`).join("")}${n>3?`<em>+${n-3} more</em>`:""}</div>`:""}
  </div>`;
}


function renderPatients(filter=""){
  const f = filter.trim().toLowerCase();
  const list = patients.filter(p=>p.name.toLowerCase().includes(f)).sort((a,b)=>a.name.localeCompare(b.name));

    <div class="slot" data-id="${p.id}">
      <div class="av">${escapeHtml(p.name.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase())}</div>
      <div class="p"><strong>${escapeHtml(p.name)}</strong>${p.phone?`<div class="r">${escapeHtml(p.phone)}</div>`:""}${p.dob?`<div class="r">Born: ${fmtDob(p.dob)}</div>`:""}</div>
      <div class="r">${appts.filter(a=>a.patientId===p.id).length} visit(s)</div>
    </div>
  `).join("");
  el.querySelectorAll(".slot").forEach(s=>{
    s.addEventListener("click",()=>openPatient(patients.find(p=>p.id===s.dataset.id)));

function escapeHtml(s){return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}



// ---- Appointment modal ----
// ===== v2: week view, today panel, agenda, WhatsApp reminders =====
function addDays(d,n){ const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()+n); return x; }
function mondayOf(d){ return addDays(d, -((d.getDay()+6)%7)); }
function parseIso(s){ const p=s.split("-").map(Number); return new Date(p[0],p[1]-1,p[2]); }
let weekStart = mondayOf(new Date());
let weekSel = new Date(); // phone: which day of the week strip is open

function apptRange(a){
  const d=a.date.split("-").map(Number), t=a.time.split(":").map(Number);
  const s=new Date(d[0],d[1]-1,d[2],t[0],t[1]);
  return [s,new Date(s.getTime()+(a.duration||30)*60000)];
}
function apptState(a){
  const r=apptRange(a), n=new Date();
  return r[1]<=n ? "past" : (r[0]<=n ? "now" : "up");
}
function moneyOf(list){ return list.filter(a=>a.paid).reduce((s,a)=>s+(a.amount||0),0); }
function nextIdOf(list){ const n=list.find(a=>apptState(a)==="up"); return n?n.id:null; }
function endTime(a){ const e=toMinutes(a.time)+(a.duration||30); return pad(Math.floor(e/60)%24)+":"+pad(e%60); }

// Amount buttons: $50 · $40 · $30 · $20 always, then other amounts he often charges. $40 is pre-filled by default.
const FIXED_AMOUNTS = [50, 40, 30, 20], DEFAULT_AMOUNT = 40;
function frequentAmounts(){
  const c = {}; appts.forEach(a=>{ if(a.paid && a.amount>0 && !FIXED_AMOUNTS.includes(a.amount)) c[a.amount] = (c[a.amount]||0)+1; });
  const extra = Object.entries(c).filter(x=>x[1]>=3).sort((x,y)=>y[1]-x[1] || x[0]-y[0]).slice(0,2).map(x=>+x[0]);
  return [...FIXED_AMOUNTS, ...extra];
}

    +'<div class="qp-amts">'+frequentAmounts().map(v=>'<button type="button" class="qp-amt" data-v="'+v+'">$'+v+'</button>').join("")+'</div>'
    +'<div class="field" style="margin-top:12px"><input id="qpOther" type="text" inputmode="decimal" autocomplete="off" placeholder="Other amount ($)"></div>'
    +'<div class="row"><button class="btn" id="qpSave">Save as paid</button><button class="btn secondary" id="qpFree">Free</button></div></div></div>';
  const close = ()=>{ root.innerHTML = ""; };
  document.getElementById("closeP").onclick = close;
  document.getElementById("ovP").addEventListener("click",e=>{ if(e.target.id==="ovP") close(); });
  let saving = false;
  const save = async amount=>{
    if(saving) return; saving = true;
    root.querySelectorAll("button").forEach(b=>b.disabled = true);
    try{ await db.doc("appointments/"+a.id).update({paid:true, amount, updatedAt:Date.now()}); }
    catch(e){ saving = false; root.querySelectorAll("button").forEach(b=>b.disabled = false); return; }
    a.paid = true; a.amount = amount; close(); refreshAll(); toast("Paid $"+amount+" ✓");
  };
  root.querySelector(".qp-amts").onclick = e=>{ const b = e.target.closest("[data-v]"); if(b) save(+b.dataset.v); };
  document.getElementById("qpSave").onclick = ()=>{
    const v = parseFloat(String(document.getElementById("qpOther").value).replace(",","."));
    if(isNaN(v) || v<=0){ alert("Tap an amount above, or type another amount."); return; }
    save(v);
