  document.getElementById("qpFree").onclick = ()=>{ close(); toast("Kept as free consultation"); };
}

function apptRow(a,nextId){
  const st=apptState(a);
  const paid=a.paid?'<span class="ok">✓ $'+(a.amount||0).toFixed(2)+'</span>':(st==="past"?'<span class="freeb">Free</span>':'');
  const tag=st==="now"?'<span class="tag">NOW</span>':(a.id===nextId?'<span class="tag">NEXT</span>':'');
  const canPay=!a.paid && st!=="up";      // after (or during) the visit and not paid yet
  const wa=canPay?'<button class="qpay" data-pay="'+a.id+'" title="Record the payment">$ Paid?</button>'
    :st!=="past"?(isSent(a)?'<span class="ok" style="align-self:center;font-size:.75rem">✓ Sent</span>':'<button class="wa" data-wa="'+a.id+'" title="Send WhatsApp reminder">'+WA_ICON+'<span>Remind</span></button>'):'';
  return '<div class="titem '+st+'" data-id="'+a.id+'"><div class="tt">'+a.time+'<small>'+endTime(a)+'</small></div>'
    +'<div class="tn"><b>'+escapeHtml(a.patientName)+'</b>'+tag
    +(a.reason?'<small>'+escapeHtml(a.reason)+'</small>':'')+(paid?'<small>'+paid+'</small>':'')+'</div>'+wa+'</div>';
}
function bindRows(el){
  el.onclick=e=>{
    const wa=e.target.closest("[data-wa]");
    if(wa){ e.stopPropagation(); sendWhatsApp(appts.find(a=>a.id===wa.dataset.wa)); return; }
    const pay=e.target.closest("[data-pay]");
    if(pay){ e.stopPropagation(); openQuickPay(appts.find(a=>a.id===pay.dataset.pay)); return; }
    const row=e.target.closest("[data-id]");
    if(row) openApptModal(appts.find(a=>a.id===row.dataset.id));
  };
}

function renderWeek(){
  const end=addDays(weekStart,6);
  const range=weekStart.toLocaleDateString(__LOC,{month:"short",day:"numeric"})+" – "+
    end.toLocaleDateString(__LOC,{month:"short",day:"numeric",year:"numeric"});
  const todayIso=iso(new Date());
  let total=0, count=0, html="";
  for(let i=0;i<7;i++){
    const d=addDays(weekStart,i), key=iso(d), list=apptsForDate(d);
    total+=moneyOf(list); count+=list.length;
    html+='<div class="wcol'+(key===todayIso?' today':'')+'">'
      +'<div class="whead" data-date="'+key+'"><span>'+DOW[i]+'</span><b>'+d.getDate()+'</b>'+(list.length?'<small class="wn">'+list.length+'</small>':'')+'</div>'
      +(list.length?list.map(a=>'<div class="chip '+apptState(a)+'" data-id="'+a.id+'"><span class="ct">'+a.time+'</span>'
        +(a.paid?'<span class="cp">✓</span>':'')+'<div class="cn">'+escapeHtml(a.patientName)+'</div></div>').join(""):'<div class="wempty">Free</div>')
      +'<button class="wadd" data-add="'+key+'">+ Add</button></div>';
  }
  document.getElementById("weekRevenue").textContent="Collected this week: $"+total.toFixed(2);
  document.getElementById("weekLabel").innerHTML=range+'<small class="cnt">'+apptCount(count)+'<span class="wk-money"> · $'+total.toFixed(2)+' collected · '+weekFree().length+' free</span></small>';
  renderWeekStrip(todayIso, total);
  renderTimeGrid(); renderStats(); miniMonth = new Date(weekStart.getFullYear(), weekStart.getMonth(), 1); renderSide();
  const grid=document.getElementById("weekGrid");
  grid.innerHTML=html;
  grid.onclick=e=>{
    const chip=e.target.closest("[data-id]");
    if(chip){ openApptModal(appts.find(a=>a.id===chip.dataset.id)); return; }
    const add=e.target.closest("[data-add]");
    if(add){ selectedDate=parseIso(add.dataset.add); openApptModal(null); return; }
    const head=e.target.closest("[data-date]");
    if(head){ selectedDate=parseIso(head.dataset.date); switchView("day"); }
  };
}

function renderWeekStrip(todayIso, total){

    +(isToday?'<div class="tp-bar"><i style="width:'+(list.length?Math.round(done/list.length*100):0)+'%"></i></div>':'<div style="height:12px"></div>')
    +'<div id="wdList">'+(list.length?list.map(a=>apptRow(a,isToday?nextIdOf(list):null)).join(""):'<div class="empty">No appointments — tap + to add one</div>')+'</div>'

  bindRows(document.getElementById("wdList"));
  // Phone: income of the selected day and of the week, at the top of the page.

  document.getElementById("weekMoney").innerHTML =
    '<button type="button" class="mm-inc" data-inc="day" aria-label="Income details of the day"><span>'+dayName+'</span><b>$'+moneyOf(list).toFixed(2)+'</b></button>'

    +(weekFree().length
      ? '<button type="button" class="mm-free" aria-label="See the free consultations of this week"><span>Free</span><b>'+weekFree().length+'</b></button>'
      : '<div class="mm-free mm-none"><span>Free</span><b>0</b></div>');

  document.querySelectorAll("#weekMoney .mm-inc").forEach(b=>b.onclick = ()=>{
    if(b.dataset.inc==="day") openIncome(fmtDay(weekSel), selIso, selIso);
    else openIncome("Week of "+weekStart.toLocaleDateString(__LOC,{month:"short",day:"numeric"}), iso(weekStart), iso(addDays(weekStart,6)));
  });

// Phone: highlight the "Calendar" tab and the Week / Month / Agenda switch. Returns true for a calendar view.
function markCal(v){
  const cal = ["week","month","day"].includes(v);
  document.querySelector(".tab-cal").classList.toggle("active", cal);
  document.querySelectorAll("#calSeg [data-cv]").forEach(b=>b.classList.toggle("on", b.dataset.cv===v));
  return cal;
}
function switchView(v){
  view=v;
  document.body.dataset.view=v;
  document.querySelectorAll(".tab-btn[data-view]").forEach(b=>b.classList.toggle("active",b.dataset.view===(v==="patient"?"patients":v)));
  if(markCal(v)){ try{ localStorage.setItem("clinic_cal_view", v); }catch(e){} }
  ["week","month","day","patients","messages","patient","hospital","clinics","finance"].forEach(id=>{ document.getElementById(id+"View").style.display=id===v?"":"none"; });
  const solo=v==="patients"||v==="messages"||v==="patient"||v==="hospital"||v==="clinics"||v==="finance";
  document.getElementById("todayPanel").style.display=solo?"none":"";
  document.querySelector(".layout").classList.toggle("solo",solo);
  if(v==="week") renderWeek();
  if(v==="month") renderMonth();
  if(v==="day") renderDay();
  if(v==="patients") renderPatients(document.getElementById("patientSearch").value);
  if(v==="messages") renderMessages();
  if(v==="hospital") renderHospital();
  if(v==="clinics") renderClinics();
  if(v==="finance") renderFinance();
  if(v==="patient") renderPatientPage();
}

function wireEvents(){
  const $=id=>document.getElementById(id);
  document.querySelectorAll(".tab-btn[data-view]").forEach(b=>b.addEventListener("click",()=>switchView(b.dataset.view)));

  document.querySelector(".tab-cal").onclick=()=>{ let v="week"; try{ v=localStorage.getItem("clinic_cal_view")||"week"; }catch(e){} switchView(["week","month","day"].includes(v)?v:"week"); };

}

// ----- WhatsApp reminders (opens WhatsApp with the message ready; the doctor taps Send) -----
const MSG_DEFAULTS = {
  fr:{t:"{clinic} – Rappel : bonjour {name}, vous avez un rendez-vous le {date} à {time}. Merci de répondre pour confirmer.", c:"Cabinet du Dr Nadim"},
  ar:{t:"مرحبًا {name}، نذكّرك من {clinic} بأن لديك موعدًا يوم {date} الساعة {time}. الرجاء الرد للتأكيد. شكرًا!", c:"عيادة الدكتور نديم"},
  en:{t:"Hello {name}, this is a reminder from {clinic}: you have an appointment on {date} at {time}. Please reply to confirm. Thank you!", c:"Dr. Nadim's clinic"}};
const MSG_D = MSG_DEFAULTS[window.__LANG] || MSG_DEFAULTS.en;
const DEFAULT_TEMPLATE = MSG_D.t;
const WA_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3.5 20.5l1.4-4.2A8.3 8.3 0 1 1 8 19.3z"/><path d="M9.2 8.4c.1 3.3 2.9 6.2 6.3 6.4l1-1.5-2.1-1-1 .8a4.6 4.6 0 0 1-2.4-2.4l.8-1-1-2.1z" fill="currentColor" stroke="none"/></svg>';
function getMsgSettings(){
  let s={}; try{ s=JSON.parse(localStorage.getItem("clinic_msg_"+window.__LANG)||"{}"); }catch(e){}
  return {clinic:s.clinic||MSG_D.c, cc:s.cc||"961", template:s.template||DEFAULT_TEMPLATE};
}
function sentMap(){ try{ return JSON.parse(localStorage.getItem("clinic_sent")||"{}"); }catch(e){ return {}; } }
function isSent(a){ return !!(a.reminderSentAt || sentMap()[a.id]); }
function clearSentLocal(id){ const m=sentMap(); delete m[id]; try{ localStorage.setItem("clinic_sent",JSON.stringify(m)); }catch(e){} }
async function markSent(a){
  const t=Date.now(), m=sentMap(); m[a.id]=t;
  try{ localStorage.setItem("clinic_sent",JSON.stringify(m)); }catch(e){}
  const real=appts.find(x=>x.id===a.id); if(real) real.reminderSentAt=t;
  refreshAll();
  try{ await db.doc("appointments/"+a.id).update({reminderSentAt:t},true); }catch(e){}
}
function normPhone(raw,cc){
  let d=String(raw||"").replace(/\D/g,"");
  if(!d) return "";
  if(d.startsWith("00")) d=d.slice(2);
  else if(d.startsWith("0")) d=cc+d.slice(1);
  else if(d.length<=8) d=cc+d;
  return d;
}
function buildMsg(a){
  const st=getMsgSettings();
  return st.template.replace(/\{name\}/g,a.patientName)
    .replace(/\{date\}/g,parseIso(a.date).toLocaleDateString(__LOC,{weekday:"long",month:"long",day:"numeric"}))
    .replace(/\{time\}/g,a.time).replace(/\{clinic\}/g,st.clinic);
}
function sendWhatsApp(a,phoneOverride){
  if(!a || isSent(a)) return;
  const p=patients.find(x=>x.id===a.patientId);
  const num=normPhone(phoneOverride||(p&&p.phone)||"",getMsgSettings().cc);
  if(!num){ alert("Add a phone number for this patient first."); return; }
  window.open("https://wa.me/"+num+"?text="+encodeURIComponent(buildMsg(a)),"_blank");
  markSent(a);
}

function renderMessages(){
  const st=getMsgSettings(), sent=sentMap(), el=document.getElementById("messagesView");
  const from=iso(new Date()), to=iso(addDays(new Date(),7));
  const upcoming=appts.filter(a=>a.date>=from&&a.date<=to&&apptState(a)!=="past")
    .sort((x,y)=>(x.date+x.time).localeCompare(y.date+y.time));
  const rows=upcoming.map(a=>{
    const p=patients.find(x=>x.id===a.patientId), phone=p&&p.phone;

      +'<div class="r">'+parseIso(a.date).toLocaleDateString(__LOC,{weekday:"short",month:"short",day:"numeric"})+' · '
      +(phone?escapeHtml(phone):'<span class="bad">No phone number</span>')+'</div></div>'
      +(isSent(a)?'<span class="ok">✓ Sent</span>':'<button class="wa" data-wa="'+a.id+'">'+WA_ICON+'<span>Send</span></button>')+'</div>';
  }).join("");
  el.innerHTML='<div class="card" style="margin-bottom:14px"><h2 style="margin:0 0 4px;font-size:1.05rem;display:flex;align-items:center;gap:8px"><span class="wa-badge">'+WA_ICON+'</span><span>WhatsApp reminders</span></h2>'
    +'<div class="sub" style="margin-bottom:12px">Tap Send: WhatsApp opens with the patient and the message ready, you just press send.</div>'
    +'<div class="field"><label>Clinic / doctor name (used in the message)</label><input id="msgClinic" value="'+escapeHtml(st.clinic)+'"></div>'

    +'<div class="sub">You can use {name} {date} {time} {clinic}</div></div>'

    +'<button class="btn" id="msgSave">Save message</button></div>'
    +'<label>Upcoming appointments, next 7 days</label>'
    +'<div class="card" id="msgList" style="margin-top:6px">'+(rows||'<div class="empty">No upcoming appointments</div>')+'</div>';
  bindRows(document.getElementById("msgList"));

    const v={clinic:document.getElementById("msgClinic").value.trim(),

      cc:document.getElementById("msgCC").value.replace(/\D/g,"")};

    const b=e.target; b.textContent="Saved ✓"; setTimeout(()=>{ b.textContent="Save message"; },1500);
  };
}


// Eye exam: one box per cell. The DOM order goes down each column (OD, OS, OU), so the
// phone keyboard's "Next" key follows the order the doctor measures in.
const EXAM_LABEL = {vaUnc:"VA uncorrected", vaCor:"VA corrected", iop:"IOP"};
function exIn(eye, key){
  const iop = key==="iop";
  return '<input class="ex-in" data-k="'+eye+'.'+key+'" aria-label="'+eye.toUpperCase()+' '+EXAM_LABEL[key]+'" autocomplete="off" autocapitalize="characters" spellcheck="false"'
    +' inputmode="'+(iop?'numeric':'decimal')+'" maxlength="'+(iop?3:6)+'" enterkeyhint="next" placeholder="–">';
}
function readExam(root){
  const o = {v:{}}; let any = false;
  root.querySelectorAll(".ex-in").forEach(i=>{ const v = i.value.trim(); if(!v) return; const [e,k] = i.dataset.k.split("."); o[e][k] = v; any = true; });
  return any ? o : null;
}
function fillExam(root, x){
  if(!x || typeof x!=="object") return;
  root.querySelectorAll(".ex-in").forEach(i=>{ const [e,k] = i.dataset.k.split("."); i.value = (x[e]||{})[k] || ""; });
}

  const close=()=>root.innerHTML="";

    b.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); (exBoxes[i+1]||b).focus(); if(!exBoxes[i+1]) b.blur(); } });
    if(b.dataset.k.endsWith(".iop")) b.addEventListener("input",()=>{ b.value=b.value.replace(/\D/g,""); });

  let matchedPatientId = isEdit ? appt.patientId : null;
  const nameInput = document.getElementById("fName");
  const matchBox = document.getElementById("matchBox");
  nameInput.addEventListener("input",()=>{
    const v = nameInput.value.trim().toLowerCase();
    matchedPatientId = null;
    if(!v){ matchBox.innerHTML=""; return; }
    const found = patients.find(p=>p.name.trim().toLowerCase()===v);
    if(found){
      matchedPatientId = found.id;
      const ph = document.getElementById("fPhone"); if(ph && !ph.value.trim() && found.phone) ph.value = found.phone;
      matchBox.innerHTML = `<div class="match">Existing patient: ${escapeHtml(found.name)}${found.phone?" · "+escapeHtml(found.phone):""}</div>`;
    } else {

    }
  });
  if(isEdit) nameInput.dispatchEvent(new Event("input"));

  // --- patient suggestions while typing ---
  const suggestBox = document.getElementById("suggestBox");
  function drawSuggest(){
    const v = nameInput.value.trim().toLowerCase();

  }
  nameInput.addEventListener("input",drawSuggest);
  nameInput.addEventListener("focus",drawSuggest);
  nameInput.addEventListener("blur",()=>setTimeout(()=>{ suggestBox.innerHTML=""; },150));
  suggestBox.addEventListener("mousedown",e=>e.preventDefault());
  suggestBox.addEventListener("click",e=>{
    const b=e.target.closest("[data-pick]"); if(!b) return;

  async function takeFiles(list){

  const DAY_START = 8*60, DAY_END = 18*60, SLOT_LEN = 30;

  function buildSlots(dateVal, excludeId){
    const dayAppts = appts.filter(a=>a.date===dateVal && a.id!==excludeId);
    const slots = [];
    for(let mins=DAY_START; mins+SLOT_LEN<=DAY_END; mins+=SLOT_LEN){
      const s = pad(Math.floor(mins/60))+":"+pad(mins%60);
      const endMins = mins+SLOT_LEN;
      const e = pad(Math.floor(endMins/60)%24)+":"+pad(endMins%60);
      const busy = dayAppts.some(a=>{const st=toMinutes(a.time);const en=st+(a.duration||30);return mins<en && st<endMins;});
      if(!busy) slots.push({time:s,label:s+"–"+e});
    }
    return slots;
  }

  function refreshSlotOptions(){
    const slots = buildSlots(dateEl.value, isEdit?appt.id:null);
    if(isEdit && !slots.find(s=>s.time===appt.time)){
      slots.unshift({time:appt.time, label:appt.time+" (current)"});
    }
    if(!slots.length){
      slotSel.innerHTML = `<option value="">No free slots this day</option>`;
      return;
    }
    slotSel.innerHTML = slots.map(s=>`<option value="${s.time}">${s.label}</option>`).join("");
    let chosen = isEdit && slots.find(s=>s.time===appt.time) ? appt.time : null;
    if(!chosen && nextSlotTime && slots.find(s=>s.time===nextSlotTime)) chosen = nextSlotTime;
    nextSlotTime = null;
    if(!chosen) chosen = (slots.find(s=>s.time>="09:00")||slots[0]).time;
    slotSel.value = chosen;
    applySlotSelection();
  }
  function applySlotSelection(){
    if(!slotSel.value) return;
    timeEl.value = slotSel.value;
    durEl.value = 30;
    checkConflicts();
  }
  slotSel.addEventListener("change",applySlotSelection);
  dateEl.addEventListener("change",()=>{ if(!customToggle.checked) refreshSlotOptions(); });
  customToggle.addEventListener("change",()=>{
    if(customToggle.checked){

      durationFieldWrap.style.display="none";

  if(customToggle.checked){

  const paidEl = document.getElementById("fPaid");
  const amountField = document.getElementById("amountField");
  paidEl.addEventListener("change",()=>{ amountField.style.display = paidEl.checked ? "block" : "none"; });
  const amtIn = document.getElementById("fAmount"), amtChips = document.getElementById("amtChips");
  const markAmt = ()=>amtChips.querySelectorAll("[data-amt]").forEach(b=>b.classList.toggle("on", Number(b.dataset.amt)===Number(amtIn.value)));
  root.querySelector(".paymode").onclick = e=>{
    const b = e.target.closest("[data-paid]"); if(!b) return;
    paidEl.checked = b.dataset.paid==="1"; paidEl.dispatchEvent(new Event("change"));
    root.querySelectorAll(".paymode [data-paid]").forEach(x=>x.classList.toggle("on", x===b));
    if(paidEl.checked && !amtIn.value) amtIn.value = DEFAULT_AMOUNT;   // $40 pre-filled
    markAmt();
  };
  amtChips.onclick = e=>{ const b = e.target.closest("[data-amt]"); if(!b) return; amtIn.value = b.dataset.amt; markAmt(); };
  amtIn.addEventListener("input", markAmt); markAmt();

  // The new appointment's id is fixed when the form opens: even if Save got through twice,
  // the database would refuse a second record with the same id.
  const newApptId = uid();
  const saveBtn = document.getElementById("saveAppt");
  let saving = false;
  // Block double taps: ignore Save while a save is already running.
  saveBtn.onclick = async()=>{
    if(saving) return;
    saving = true; saveBtn.disabled = true;
    try{ await doSave(); }
    finally{ saving = false; if(saveBtn.isConnected) saveBtn.disabled = false; }
  };
  const doSave = async()=>{
    const name = nameInput.value.trim();
    const date = document.getElementById("fDate").value;
    const time = document.getElementById("fTime").value;
    const duration = document.getElementById("fDuration").value;
    const reason = document.getElementById("fReason").value.trim();
    const treatment = document.getElementById("fTreatment").value.trim();
    const phoneVal = document.getElementById("fPhone").value.trim();
    const notes = document.getElementById("fNotes").value.trim();
    const paid = document.getElementById("fPaid").checked;
    const amount = paid ? (parseFloat(document.getElementById("fAmount").value)||0) : 0;
    if(!name||!date||!time){ alert("Name, date and time are required."); return; }
    const conflicts = findConflicts(date,time,duration,isEdit?appt.id:null);
    if(conflicts.length){
      const ok = confirm("This slot overlaps an existing appointment ("+conflicts.map(a=>a.patientName+" "+a.time).join(", ")+"). Save anyway?");
      if(!ok) return;
    }

    let patientId = matchedPatientId;
    if(!patientId){
      const existing = patients.find(p=>p.name.trim().toLowerCase()===name.toLowerCase());
      if(existing){ patientId = existing.id; }
      else{
        patientId = uid();
        const pdoc = {name, phone:phoneVal, dob:"", address:"", notes:"", createdAt:Date.now()};
        patients.push({id:patientId,...pdoc});
        if(db){ try{ await db.doc("patients/"+patientId).set(pdoc); }catch(e){} }
      }
    }
    const pat = patients.find(x=>x.id===patientId);
    if(pat && phoneVal && pat.phone !== phoneVal){
      pat.phone = phoneVal;
      try{ await db.doc("patients/"+patientId).update({phone:phoneVal}); }catch(e){}
    }
    const adoc = {patientId, patientName:name, date, time, duration:Number(duration)||30, reason, notes, exam:readExam(root), treatment, paid, amount, updatedAt:Date.now()};
    if(isEdit && isSent(appt) && (appt.date!==date || appt.time!==time)){ clearSentLocal(appt.id); if(appt.reminderSentAt) adoc.reminderSentAt = null; }
    if(isEdit){
      Object.assign(appt, adoc);
      if(db){ try{ await db.doc("appointments/"+appt.id).update(adoc); }catch(e){} }
    } else {
      const id = newApptId;
      appts.push({id,...adoc});
      if(db){ try{ await db.doc("appointments/"+id).set(adoc); }catch(e){} }
      savedId = id;
    }
    if(pending.length){
      const sb2=document.getElementById("saveAppt"); sb2.disabled=true;
      await uploadMany(pending.splice(0), patientId, isEdit?appt.id:savedId, fStatus);
    }
    close(); refreshAll(); toast("Saved ✓");
  };

  if(isEdit){
    document.getElementById("waBtn").onclick=()=>{
      sendWhatsApp(
      Object.assign({},appt,{patientName:document.getElementById("fName").value.trim()||appt.patientName,date:document.getElementById("fDate").value,time:document.getElementById("fTime").value}),
      document.getElementById("fPhone").value.trim());
      if(isSent(appt)){ const b=document.getElementById("waBtn"); b.disabled=true; b.textContent="✓ Sent"; }
    };
    document.getElementById("delAppt").onclick=async()=>{
      if(!confirm("Are you sure you want to delete this appointment?\n\nThis cannot be undone.")) return;
      try{ await db.doc("appointments/"+appt.id).delete(); }catch(e){ return; }
      appts = appts.filter(a=>a.id!==appt.id);
      close(); refreshAll();
    };
  }
}

let attachments = [];
let filesReady = null; // false = files could not be loaded

async function loadAttachments(){
  try{
    const rows = (await fetchAll("attachments")).sort((a,b)=>(Number(b.created_at)||0)-(Number(a.created_at)||0));
    attachments = (rows||[]).map(r=>({id:r.id, patientId:r.patient_id, appointmentId:r.appointment_id||"", name:r.name||"file",
      type:r.type||"", size:Number(r.size)||0, file:r.file, category:r.category||"Other", createdAt:Number(r.created_at)||0}));
    filesReady = true;
  }catch(e){ attachments = []; filesReady = false; console.warn("Files not available:", e.message); }
}

// Files are private: each link carries a short-lived token (renewed every 2 minutes).
let fileTok = null;
async function fileToken(){
  if(fileTok && fileTok.exp > Date.now()) return fileTok.t;
  const r = await api("files/token", {method:"POST", quiet:true});
  fileTok = {t:r.token, exp:Date.now()+120000};
  return fileTok.t;
}
async function fileUrls(list, thumb){
  const t = await fileToken(), out = {};
  list.filter(Boolean).forEach(a=>{
    out[a.id] = __demoFile(a.id);
  });
  return out;
}

// Phone photos are shrunk before upload (a 5 MB photo becomes a few hundred KB).
async function shrinkImage(file){
  if(!/^image\/(jpeg|png|webp|heic|heif)$/i.test(file.type)) return file;
  try{
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, 1800/Math.max(bmp.width, bmp.height));
    if(k===1 && file.size < 600000) return file;
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width*k); c.height = Math.round(bmp.height*k);
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#fff"; ctx.fillRect(0,0,c.width,c.height);
    ctx.drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r=>c.toBlob(r, "image/jpeg", 0.82));
    if(!blob || blob.size >= file.size) return file;
    return new File([blob], file.name.replace(/\.\w+$/,"")+".jpg", {type:"image/jpeg"});
  }catch(e){ return file; }
}

async function uploadAttachment(file, patientId, appointmentId, category){
  const f = await shrinkImage(file);
  const id = uid();
  const safe = (f.name.normalize("NFKD").replace(/[^\w.\-]+/g,"_").slice(-80)) || "file";
  const fd = new FormData();
  const fields = {id, patient_id:patientId, appointment_id:appointmentId||"", name:f.name, type:f.type||"", size:String(f.size), category, created_at:String(Date.now())};
  Object.entries(fields).forEach(([k,v])=>fd.append(k,v));
  fd.append("file", f, safe);
  const r = await api("collections/attachments/records", {method:"POST", quiet:true, body:fd});
  const a = {id, patientId, appointmentId:appointmentId||"", name:f.name, type:f.type, size:f.size, file:r.file, category, createdAt:Number(r.created_at)};
  attachments.unshift(a);
  return a;
}

async function uploadMany(items, patientId, appointmentId, statusEl){
  let ok = 0;
  for(let i=0;i<items.length;i++){
    if(statusEl) statusEl.textContent = "Uploading "+(i+1)+" of "+items.length+"…";
    try{ await uploadAttachment(items[i].file, patientId, appointmentId, items[i].cat); ok++; }
    catch(e){ alert("Could not upload \""+items[i].file.name+"\": "+e.message); }
  }
  if(statusEl) statusEl.textContent = "";
  if(ok) toast(ok===1 ? "File saved ✓" : ok+" files saved ✓");
  return ok;
}

async function deleteAttachment(a){
  await api("collections/attachments/records/"+encodeURIComponent(a.id), {method:"DELETE", quiet:true});
  attachments = attachments.filter(x=>x.id!==a.id);
}
async function confirmDeleteFile(a){
  if(!confirm("Delete \""+a.name+"\"?\n\nThis cannot be undone.")) return false;
  try{ await deleteAttachment(a); toast("File deleted"); return true; }
  catch(e){ alert("Could not delete the file: "+e.message); return false; }
}

// Open (preview) or download. The tab is opened first so phones don't block it as a pop-up.
async function openAttachment(a, download){
  if(!a) return;
  const w = window.open("", "_blank");
  try{
    const url = (await fileUrls([a]))[a.id];
    if(!url) throw new Error("File not found");
    const full = download ? url+"&download=1" : url;
    if(w) w.location = full; else location.href = full;
  }catch(e){ if(w) w.close(); alert("Could not open the file: "+e.message); }
}

function isImage(a){ return /^image\//.test(a.type); }
function fmtSize(n){ return n>=1048576 ? (n/1048576).toFixed(1)+" MB" : Math.max(1,Math.round(n/1024))+" KB"; }
function fmtShort(ms){ return new Date(ms).toLocaleDateString(__LOC,{month:"short",day:"numeric",year:"numeric"}); }
function fileRow(a){
  return '<div class="frow" data-open="'+a.id+'"><div class="fi" data-thumb="'+a.id+'">'+(isImage(a)?ICON.img:ICON.doc)+'</div>'
    +'<div class="fn"><b>'+escapeHtml(a.name)+'</b><span class="r">'+escapeHtml(a.category)+' · '+fmtSize(a.size)+' · '+fmtShort(a.createdAt)+'</span></div>'
    +'<button type="button" class="fx" data-del="'+a.id+'" aria-label="Delete file">×</button></div>';
}
async function fillThumbs(root){
  const els = [...root.querySelectorAll("[data-thumb]")];
  const list = els.map(el=>attachments.find(a=>a.id===el.dataset.thumb)).filter(a=>a && isImage(a));
  if(!list.length) return;
  try{
    const urls = await fileUrls(list, "400x300");
    els.forEach(el=>{ const u = urls[el.dataset.thumb]; if(!u) return;
      const im = new Image(); im.alt = ""; im.onload = ()=>{ el.innerHTML = ""; el.appendChild(im); }; im.src = u; });
  }catch(e){}
}

function toast(msg, ms){
  let t = document.getElementById("toast");
  if(!t){ t = document.createElement("div"); t.id = "toast"; t.setAttribute("role","status"); document.body.appendChild(t); }
  t.textContent = msg; t.className = "show";
  clearTimeout(t._h); t._h = setTimeout(()=>{ t.className = ""; }, ms||2200);
}
function initials(name){ return (name||"?").trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase(); }
function avatarHtml(name){ return '<div class="av">'+escapeHtml(initials(name))+'</div>'; }
// Date of birth is stored as "YYYY-MM-DD", or "YYYY" when only the year is known.
function fmtDob(dob){
  if(!dob) return "";
  if(/^\d{4}$/.test(dob)) return dob;
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(dob);
  return m ? m[3]+"/"+m[2]+"/"+m[1] : dob;
}
// Reads what was typed: "12031952", "12/03/1952" or "1952". Returns the stored form, "" for empty, or null if invalid.
function parseDob(txt){
  const d = String(txt||"").replace(/\D/g,""), now = new Date();
  if(!d) return "";
  if(d.length===4){ const y = +d; return (y>=1900 && y<=now.getFullYear()) ? d : null; }
  if(d.length!==8) return null;
  const day = +d.slice(0,2), mon = +d.slice(2,4), y = +d.slice(4);
  const dt = new Date(y, mon-1, day);
  if(y<1900 || dt.getFullYear()!==y || dt.getMonth()!==mon-1 || dt.getDate()!==day || dt>now) return null;
  return y+"-"+pad(mon)+"-"+pad(day);
}
function ageOf(dob){
  if(!dob) return null;
  if(/^\d{4}$/.test(dob)) return Math.max(0, new Date().getFullYear() - +dob);
  const b = parseIso(dob), n = new Date();
  let y = n.getFullYear()-b.getFullYear();
  if(n.getMonth()<b.getMonth() || (n.getMonth()===b.getMonth() && n.getDate()<b.getDate())) y--;
  return y>=0 ? y : null;
}

function renderPatientInfo(body, p){
  const withAllergy = hasAllergyColumn();
  body.innerHTML = '<div class="card" style="padding:16px">'
    +'<div class="field"><label for="pPhone">Phone</label><input id="pPhone" type="tel" value="'+escapeHtml(p.phone||"")+'"></div>'

    +(withAllergy?'<div class="field"><label for="pAllergies">Allergies</label><input id="pAllergies" placeholder="e.g. Penicillin, latex" value="'+escapeHtml(p.allergies||"")+'"></div>':'')
    +'<div class="field"><label for="pAddress">Address</label><input id="pAddress" value="'+escapeHtml(p.address||"")+'"></div>'
    +'<div class="field"><label for="pNotes">General medical notes (history'+(withAllergy?'':', allergies')+'…)</label><textarea id="pNotes" style="min-height:110px">'+escapeHtml(p.notes||"")+'</textarea></div>'
    +'<div class="row"><button class="btn" id="savePatient">Save</button><button class="btn danger" id="delPatient">Delete patient</button></div></div>';
  const dobIn = document.getElementById("pDob");
  dobIn.addEventListener("input", ()=>{
    const d = dobIn.value.replace(/\D/g,"").slice(0,8);
    dobIn.value = d.length<=4 ? d : d.slice(0,2)+"/"+d.slice(2,4)+"/"+d.slice(4);
  });
  document.getElementById("savePatient").onclick = async()=>{
    const dobVal = parseDob(dobIn.value);
    if(dobVal===null){ alert("Please check the date of birth: day, month, year (for example 12/03/1952), or only the year (1952). It can't be in the future."); dobIn.focus(); return; }
    const upd = {phone:document.getElementById("pPhone").value.trim(), dob:dobVal,
      address:document.getElementById("pAddress").value.trim(), notes:document.getElementById("pNotes").value.trim()};
    if(withAllergy) upd.allergies = document.getElementById("pAllergies").value.trim();
    try{ await db.doc("patients/"+p.id).update(upd); }catch(e){ return; }
    Object.assign(p, upd);
    toast("Saved ✓"); renderPatientPage();
  };
  document.getElementById("delPatient").onclick = async()=>{
    const mine = appts.filter(a=>a.patientId===p.id);
    const myFiles = attachments.filter(a=>a.patientId===p.id);
    let msg = "Are you sure you want to delete " + p.name + "?";
    if(mine.length || myFiles.length) msg += "\n\nTheir " + mine.length + " appointment(s), all visit notes and " + myFiles.length + " file(s) will also be permanently deleted.";
    msg += "\n\nThis cannot be undone.";
    if(!confirm(msg)) return;
    try{
      for(const f of myFiles){ await deleteAttachment(f); }
      for(const a of mine){ await db.doc("appointments/"+a.id).delete(); }
      await db.doc("patients/"+p.id).delete();
    }catch(e){ if(e.message!=="Delete not allowed") alert("Could not delete everything: "+e.message); return; }
    appts = appts.filter(a=>a.patientId!==p.id);
    patients = patients.filter(x=>x.id!==p.id);
    toast("Patient deleted");
    switchView("patients"); refreshAll();
  };
}


const modalHost = document.getElementById("modalRoot");

new MutationObserver(()=>{
  const open = modalHost.children.length > 0;
  const cl = document.body.classList;
  if(open && !cl.contains("modal-open")){
    lockedY = window.scrollY;
    document.body.style.top = (-lockedY)+"px";
    cl.add("modal-open");
  } else if(!open && cl.contains("modal-open")){
    cl.remove("modal-open");
    document.body.style.top = "";
    window.scrollTo(0, lockedY);
  }
}).observe(modalHost,{childList:true});

const HOUR_PX = 72;
let nextSlotTime = null;  // time picked by clicking an empty spot in the hour grid
let miniMonth = null;
ICON.cal = svgIcon('<rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/>');

function renderTimeGrid(){
  const el = document.getElementById("timeGrid");
  if(!el) return;
  const todayIso = iso(new Date());
  const days = [0,1,2,3,4,5,6].map(i=>addDays(weekStart,i));
  const lists = days.map(d=>apptsForDate(d));
  let startH = 8, endH = 18;
  lists.flat().forEach(a=>{ const st = toMinutes(a.time), en = st+(a.duration||30); startH = Math.min(startH, Math.floor(st/60)); endH = Math.max(endH, Math.ceil(en/60)); });
  endH = Math.min(endH, 24);
  const H = (endH-startH)*HOUR_PX, y = m=>(m-startH*60)/60*HOUR_PX;
  const now = new Date(), nowMin = now.getHours()*60+now.getMinutes();

  let html = '<div class="tg-head"><div></div>'+days.map((d,i)=>{
    const n = lists[i].length;
    return '<button type="button" class="tg-dh'+(iso(d)===todayIso?' today':'')+'" data-day="'+iso(d)+'" aria-label="Open '+fmtDay(d)+'"><span>'+DOW[i]+'</span><b>'+d.getDate()+'</b><small>'+(n?n+' appt'+(n>1?'s':''):'Free')+'</small></button>';
  }).join("")+'</div><div class="tg-body"><div class="tg-hours" style="height:'+H+'px">';
  for(let h=startH+1; h<endH; h++) html += '<div style="top:'+(h-startH)*HOUR_PX+'px">'+pad(h)+':00</div>';
  html += '</div>';
  days.forEach((d,i)=>{
    const key = iso(d);
    html += '<div class="tg-col'+(key===todayIso?' today':'')+'" data-col="'+key+'" style="height:'+H+'px">';
    lists[i].forEach(a=>{
      const st = toMinutes(a.time), dur = a.duration||30, h = Math.max(20, dur/60*HOUR_PX-3);
      html += '<div class="ev '+apptState(a)+(h<36?' short':'')+'" data-id="'+a.id+'" style="top:'+(y(st)+1)+'px;height:'+h+'px" title="'+escapeHtml(a.patientName)+' · '+a.time+'–'+endTime(a)+(a.reason?' · '+escapeHtml(a.reason):'')+'">'
        +(a.paid?'<span class="ep">✓</span>':'')+'<span class="et">'+a.time+'</span><b>'+escapeHtml(a.patientName)+'</b>'
        +(h>=52 && a.reason?'<span class="er">'+escapeHtml(a.reason)+'</span>':'')+'</div>';
    });
    if(key===todayIso && nowMin>=startH*60 && nowMin<=endH*60) html += '<div class="nowline" style="top:'+y(nowMin)+'px"></div>';
    html += '<div class="ghost" hidden></div></div>';
  });
  el.innerHTML = html+'</div>';

  const slotAt = (col,e)=>{
    const r = col.getBoundingClientRect();
    const m = startH*60 + Math.floor(((e.clientY-r.top)/HOUR_PX*60)/20)*20;
    return Math.max(startH*60, Math.min(m, endH*60-20));
  };
  const hhmm = m=>pad(Math.floor(m/60))+":"+pad(m%60);
  el.onclick = e=>{
    const ev = e.target.closest("[data-id]");
    if(ev){ openApptModal(appts.find(a=>a.id===ev.dataset.id)); return; }
    const dh = e.target.closest("[data-day]");
    if(dh){ selectedDate = parseIso(dh.dataset.day); switchView("day"); return; }
    const col = e.target.closest("[data-col]");
    if(col){ selectedDate = parseIso(col.dataset.col); nextSlotTime = hhmm(slotAt(col,e)); openApptModal(null); }
  };
  el.onmousemove = e=>{
    el.querySelectorAll(".ghost").forEach(g=>{ g.hidden = true; });
    if(e.target.closest("[data-id]")) return;
    const col = e.target.closest("[data-col]");
    if(!col) return;
    const m = slotAt(col,e), g = col.querySelector(".ghost");
    g.style.top = (y(m)+1)+"px"; g.style.height = (20/60*HOUR_PX-3)+"px";
    g.textContent = "+ "+hhmm(m); g.hidden = false;
  };
  el.onmouseleave = ()=>el.querySelectorAll(".ghost").forEach(g=>{ g.hidden = true; });
}

    const list = apptsForDate(now), done = list.filter(a=>apptState(a)==="past").length;
    c1 = card("button",' type="button" data-stat="today" title="Open today\'s agenda"',ICON.cal,"","Today",String(list.length),
      list.length ? done+" done · "+(list.length-done)+" left" : "No appointments");
    const next = nextAppointment(), tomorrow = iso(addDays(now,1));
    if(!next) c2 = card("div","",ICON.user,"amber","Next patient","—","Nothing booked yet");
    else {
      const head = next.date===todayIso ? (apptState(next)==="now" ? "With patient" : "Next patient")
        : next.date===tomorrow ? "Tomorrow"
        : "Next · "+parseIso(next.date).toLocaleDateString(__LOC,{weekday:"short",day:"numeric"});
      c2 = card("button",' type="button" data-stat="next" data-id="'+next.id+'" title="Open: '+escapeHtml(next.patientName)+'"',ICON.user,"amber",head,next.time,escapeHtml(next.patientName));
    }
  } else {
    // Another week: summary of that week.
    const pts = new Set(weekList.map(a=>a.patientId)).size;
    c1 = weekList.length
      ? card("button",' type="button" data-stat="appts" title="See the appointments"',ICON.cal,"","Appointments",String(weekList.length),"that week · tap to see")
      : card("div","",ICON.cal,"","Appointments","0","that week");
    c2 = card("div","",ICON.user,"amber","Patients",String(pts),pts===1?"patient that week":"different patients");
  }
  el.innerHTML = c1 + c2 + incomeCard(moneyOf(weekList), label, "collected", from, to) + freeCard(free, isCurrent?"this week":"that week");
  bindCards(el, {title:label, from, to}, free, label);
}

// Window listing visits of a period grouped by day (from/to are "YYYY-MM-DD", inclusive).
function periodWindow(heading, summary, list, label, procs){
  procs = procs || [];
  const days = [...new Set([...list.map(a=>a.date), ...procs.map(x=>x.date)])].sort();
  const body = days.map(d=>{
    const dl = list.filter(a=>a.date===d), dp = procs.filter(x=>x.date===d);
    return '<div class="inc-day"><span>'+parseIso(d).toLocaleDateString(__LOC,{weekday:"long",month:"short",day:"numeric"})+'</span><b>$'+moneyOf(dl).toFixed(2)+''+'</b></div>'
      + dl.map(a=>'<button type="button" class="inc-row" data-id="'+a.id+'"><span class="inc-t">'+a.time+'</span>'
        +'<span class="inc-n"><b>'+escapeHtml(a.patientName)+'</b>'+(a.reason?'<small>'+escapeHtml(a.reason)+'</small>':'')+'</span>'+label(a)+'</button>').join("")
      + dp.map(x=>'<button type="button" class="inc-row" data-proc="'+x.id+'"><span class="inc-t inc-h" title="Hospital">'+ICON.hosp+'</span>'
        +'<span class="inc-n"><b>'+escapeHtml(x.procedure)+'</b><small>'+escapeHtml([x.patientName, x.hospital, x.payer ? payerLabel(x.payer) : ""].filter(Boolean).join(" · ") || "Hospital")+'</small></span>'
        +'<span class="inc-a inc-k">'+kLabel(x)+'</span></button>').join("");
  }).join("");
  const root = document.getElementById("modalRoot");
  root.innerHTML = '<div class="overlay" id="ovI"><div class="modal"><button class="close" id="closeI" aria-label="Close">×</button>'
    +'<h2>'+heading+'</h2><div class="inc-sum">'+summary+'</div>'
    +(list.length || procs.length ? '<div id="incList">'+body+'</div>' : '<div class="empty">Nothing in this period</div>')
    +'</div></div>';
  const close = ()=>{ root.innerHTML = ""; };
  document.getElementById("closeI").onclick = close;
  document.getElementById("ovI").addEventListener("click",e=>{ if(e.target.id==="ovI") close(); });
  const il = document.getElementById("incList");
  if(il) il.onclick = e=>{
    const hp = e.target.closest("[data-proc]"); if(hp){ openHospModal(procedures.find(x=>x.id===hp.dataset.proc)); return; }
    const r = e.target.closest("[data-id]"); if(r) openApptModal(appts.find(a=>a.id===r.dataset.id));
  };
}
const sumBox = (k,v,cls)=>'<div><span>'+k+'</span><b'+(cls?' class="'+cls+'"':'')+'>'+v+'</b></div>';
const payLabel = a=> a.paid ? '<span class="inc-a">$'+(a.amount||0).toFixed(2)+'</span>'
  : isFree(a) ? '<span class="inc-a freeb">Free</span>'
  : '<span class="inc-a up">'+(apptState(a)==="now"?"Now":"Upcoming")+'</span>';
// Money of a period: paid visits (and free ones, not counted), by day.
function openIncome(title, from, to){
  const list = appts.filter(a=>a.date>=from && a.date<=to && (a.paid || isFree(a))).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  const paid = list.filter(a=>a.paid);
  periodWindow('Income · '+escapeHtml(title),
    sumBox("Collected","$"+moneyOf(paid).toFixed(2),"okb")+sumBox("Paid visits",paid.length)+sumBox("Free",list.length-paid.length,"freeb"), list, payLabel);
}
// All appointments of a period, by day.
function openAppts(title, from, to){
  const list = appts.filter(a=>a.date>=from && a.date<=to).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  periodWindow('Appointments · '+escapeHtml(title),
    sumBox("Appointments",list.length)+sumBox("Patients",new Set(list.map(a=>a.patientId)).size)+sumBox("Upcoming",list.filter(a=>apptState(a)==="up").length), list, payLabel);
}
// Money card: clinic money for the period; hospital work (in K / CS) shown underneath when any.
function incomeCard(clinic, head, detail, from, to){
  return statCard("button",' type="button" data-stat="income" title="See the details"',ICON.money,"green",head,"$"+clinic.toFixed(0),detail+" · tap for details");
}
// One click handler per card row: income details and free consultations.
function bindCards(el, period, free, freeTitle){
  el.onclick = e=>{
    const b = e.target.closest("[data-stat]"); if(!b) return;
    if(b.dataset.stat==="income") openIncome(period.title, period.from, period.to);
    else if(b.dataset.stat==="appts") openAppts(period.title, period.from, period.to);
    else if(b.dataset.stat==="today"){ selectedDate = new Date(); switchView("day"); }
    else if(b.dataset.stat==="free") openFreeList(free, freeTitle);
    else if(b.dataset.stat==="next") openApptModal(appts.find(a=>a.id===b.dataset.id));
  };
}

function renderSide(){
  const el = document.getElementById("miniCal");
  if(!el) return;
  if(!miniMonth) miniMonth = new Date(weekStart.getFullYear(), weekStart.getMonth(), 1);
  const y = miniMonth.getFullYear(), m = miniMonth.getMonth();
  const start = addDays(new Date(y,m,1), -((new Date(y,m,1).getDay()+6)%7));
  const todayIso = iso(new Date()), ws = iso(weekStart), we = iso(addDays(weekStart,6));
  const booked = new Set(appts.map(a=>a.date));
  let g = DOW.map(d=>'<span>'+d[0]+'</span>').join("");
  for(let i=0;i<42;i++){
    const d = addDays(start,i), k = iso(d);
    const cls = [d.getMonth()!==m?"o":"", k===todayIso?"t":"", k>=ws&&k<=we?"inweek":"", booked.has(k)?"has":""].join(" ").trim();
    g += '<button type="button" data-mini="'+k+'" class="'+cls+'" aria-label="'+fmtDay(d)+'">'+d.getDate()+'</button>';
  }
  el.innerHTML = '<div class="mini-h"><button type="button" data-mm="-1" aria-label="Previous month">‹</button><span>'+fmtMonth(miniMonth)+'</span><button type="button" data-mm="1" aria-label="Next month">›</button></div><div class="mini-g">'+g+'</div>';
  el.onclick = e=>{
    const mm = e.target.closest("[data-mm]");
    if(mm){ miniMonth = new Date(y, m+Number(mm.dataset.mm), 1); renderSide(); return; }
    const b = e.target.closest("[data-mini]");
    if(b){ const d = parseIso(b.dataset.mini); weekStart = mondayOf(d); weekSel = d; switchView("week"); }
  };
}

// ---- Backup: downloads everything (patients, visits, notes, payments, file list) as one file ----
async function downloadBackup(){
  const btns = document.querySelectorAll("[data-backup]");
  btns.forEach(x=>{ x.disabled = true; }); toast("Preparing backup…");
  try{
    const [p, a] = await Promise.all([fetchAll("patients"), fetchAll("appointments")]);
    let f = []; try{ f = await fetchAll("attachments"); }catch(e){}
    let h = []; try{ h = await fetchAll("procedures"); }catch(e){}
    let cd = []; try{ cd = await fetchAll("clinic_days"); }catch(e){}
    let fm = []; try{ fm = await fetchAll("finance_months"); }catch(e){}
    const data = {
      app:"clinic-backup", version:1, createdAt:new Date().toISOString(),
      counts:{patients:p.length, appointments:a.length, files:f.length, hospital_operations:h.length, clinic_days:cd.length, finance_months:fm.length},
      note:"Photos and PDFs stay on the clinic server (it also makes its own daily backups). This file lists them but does not contain them.",
      settings:{whatsapp:getMsgSettings()},
      patients:p, appointments:a, attachments:f, procedures:h, clinic_days:cd, finance_months:fm
    };
    const url = URL.createObjectURL(new Blob([JSON.stringify(data,null,2)], {type:"application/json"}));
    const link = document.createElement("a");
    link.href = url; link.download = "clinic-backup-"+iso(new Date())+".json";
    document.body.appendChild(link); link.click(); link.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 10000);
    toast("Backup saved ✓ "+p.length+" patients, "+a.length+" visits", 4000);
  }catch(e){ alert("Backup failed: "+e.message); }
  btns.forEach(x=>{ x.disabled = false; });
}
document.querySelectorAll("[data-backup]").forEach(x=>x.addEventListener("click", downloadBackup));

// ---- Hospital work: operations done at the hospital, with their amounts ----
ICON.hosp = svgIcon('<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M12 7.5v9M7.5 12h9"/>');
// Hospital acts are counted in K (coefficient of the act); CS = specialist consultation, which has no K.
const HOSP_PRESETS = ["Angiography","Angioplasty","Pacemaker","Echo","Stress test","Holter","ECG","CS"];
// Names used before the short ones: shown as the matching short name when editing.
// Default K per act (first value is filled in; when there are two, he taps the one he wants). Always editable.
const DEFAULT_K = {"Angiography":[300], "Angioplasty":[500,700], "Pacemaker":[600], "Echo":[40], "Stress test":[50], "Holter":[40], "ECG":[10]};
const HOSP_OLD = {};
// الجهة الضامنة: who pays for the act.
const PAYERS = ["رعاية","وزارة","ضمان","جيش","تعاونية","قوى الأمن","خاص"];
const payerLabel = x=>x;
// Only Cataract and Pterygium are operations; CS is counted on its own; every other act (FB, Suture, Examination, other acts) is an ER act.
const OPERATIONS = ["Angiography","Angioplasty","Pacemaker"];
const isOperation = name=>{ const n = String(name||"").trim(); return OPERATIONS.includes(HOSP_OLD[n.toLowerCase()] || n); };
const DEFAULT_HOSPITAL = "مستشفى حمود الجامعي";
const isCS = name=>String(name||"").trim().toUpperCase()==="CS";
let procedures = [], procReady = null;
let hospMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
async function loadProcedures(){
  try{ procedures = (await fetchAll("procedures")).map(r=>({id:r.id, ...fromDb(r)})); procReady = true; }
  catch(e){ procedures = []; procReady = false; console.warn("Hospital work not available:", e.message); }
}
function hospIn(from, to){ return procedures.filter(x=>x.date>=from && x.date<=to); }
function kSum(list){ return list.filter(x=>!isCS(x.procedure)).reduce((t,x)=>t+(x.amount||0),0); }
const fmtK = n=>"$"+(Math.round(n*100)/100).toLocaleString("en-US");
const K_VALUE_USD = 1;   // 1 K = $5
const fmtKUsd = n=>"$"+(Math.round(n*K_VALUE_USD*100)/100).toLocaleString("en-US");
// "85 K · 2 CS" for a list of hospital entries ("" when empty).
// "3 hospital acts" for a list of hospital entries (no K totals are shown anywhere).
const actsText = list=>list.length+" hospital act"+(list.length===1?"":"s");
function hospText(list){
  const k = kSum(list), cs = list.filter(x=>isCS(x.procedure)).length, parts = [];
  if(list.length>cs || k) parts.push(fmtK(k));
  if(cs) parts.push(cs+" CS");
  return parts.join(" · ");
}
const kLabel = x=>isCS(x.procedure) ? "" : fmtK(x.amount||0);   // a CS line already says "CS"

// One line per hospital act (used in the Hospital tab and in its detail windows).
const hospRow = x=>'<button type="button" class="inc-row hosp-row" data-proc="'+x.id+'"><span class="inc-t inc-h">'+ICON.hosp+'</span>'
  +'<span class="inc-n"><b>'+escapeHtml(x.procedure)+'</b><small>'+escapeHtml([x.patientName, x.hospital, x.payer ? payerLabel(x.payer) : ""].filter(Boolean).join(" · ") || "Hospital")+'</small></span>'
  +'<span class="inc-a inc-k">'+kLabel(x)+'</span></button>';
const hospDays = list=>[...new Set(list.map(x=>x.date))].map(d=>{
  const dl = list.filter(x=>x.date===d);
  return '<div class="inc-day"><span>'+parseIso(d).toLocaleDateString(__LOC,{weekday:"long",month:"short",day:"numeric"})+'</span><b>'+dl.length+' act'+(dl.length===1?'':'s')+'</b></div>'+dl.map(hospRow).join("");
}).join("");
// Window listing some hospital acts (a card or a payer pill was tapped), by day.
// withSummary: show the mix (operations / ER acts / CS) — only useful when the list mixes types (payer pills).
function openHospList(title, list, withSummary){
  const ops = list.filter(x=>isOperation(x.procedure)).length, cs = list.filter(x=>isCS(x.procedure)).length, er = list.length-ops-cs;
  const plural = (n,w)=>n+" "+w+(n===1?"":"s");
  const mix = [ops?plural(ops,"operation"):"", er?plural(er,"ER act"):"", cs?cs+" CS":""].filter(Boolean).join(" · ");
  const root = document.getElementById("modalRoot");
  root.innerHTML = '<div class="overlay" id="ovL"><div class="modal"><button class="close" id="closeL" aria-label="Close">×</button>'
    +'<h2>'+title+'</h2>'+(withSummary && mix ? '<div class="sub" style="margin:-6px 0 6px">'+mix+'</div>' : '')
    +(list.length ? '<div id="hlList">'+hospDays(list)+'</div>' : '<div class="empty">Nothing in this month</div>')+'</div></div>';
  const close = ()=>{ root.innerHTML = ""; };
  document.getElementById("closeL").onclick = close;
  document.getElementById("ovL").addEventListener("click",e=>{ if(e.target.id==="ovL") close(); });
  const l = document.getElementById("hlList");
  if(l) l.onclick = e=>{ const r = e.target.closest("[data-proc]"); if(r) openHospModal(procedures.find(x=>x.id===r.dataset.proc)); };
}

function renderHospital(){
  const y = hospMonth.getFullYear(), m = hospMonth.getMonth(), from = iso(new Date(y,m,1)), to = iso(new Date(y,m+1,0));
  const list = hospIn(from, to).sort((a,b)=>b.date.localeCompare(a.date) || (b.createdAt||0)-(a.createdAt||0));
  const name = hospMonth.toLocaleDateString(__LOC,{month:"long"}), ops = list.filter(x=>isOperation(x.procedure)), cs = list.filter(x=>isCS(x.procedure)).length, er = list.length-ops.length-cs;
  document.getElementById("hospLabel").innerHTML = fmtMonth(hospMonth)+'<small class="cnt">'+(list.length ? list.length+' act'+(list.length===1?'':'s') : 'Nothing yet')+'</small>';
  const counts = {}; list.forEach(x=>{ counts[x.procedure] = (counts[x.procedure]||0)+1; });
  const top = Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];
  // Total K of the month (all acts except CS) and its value in $ (1 K = $5).
  const totK = kSum(list);
  document.getElementById("hospTotal").innerHTML = totK
    ? '<span class="lbl">Total '+name+'</span><span class="val" dir="ltr">'+fmtK(totK)+'</span>' : "";
  const st = document.getElementById("hospStats");
  const card = (key,icon,tone,head,n,detail)=>n

    : statCard("div","",icon,tone,head,"0",detail);
  st.innerHTML = card("ops",ICON.hosp,"","Cath lab",ops.length,"angiography · angioplasty · pacemaker")
    + card("er",ICON.user,"amber","Tests",er,"echo · stress test · Holter · ECG")
    + card("cs",ICON.cal,"","CS",cs,"consultations");
  const pick = {ops:x=>isOperation(x.procedure), er:x=>!isOperation(x.procedure) && !isCS(x.procedure), cs:x=>isCS(x.procedure)};
  const names = {ops:"Cath lab", er:"Tests", cs:"CS"};
  st.onclick = e=>{ const b = e.target.closest("[data-hl]"); if(b) openHospList(names[b.dataset.hl]+' · '+fmtMonth(hospMonth), list.filter(pick[b.dataset.hl])); };
  // K of the month split by payer (الجهة الضامنة), largest first.
  const byPayer = {};
  list.forEach(x=>{ const k = x.payer || ""; (byPayer[k] = byPayer[k] || []).push(x); });
  const groups = Object.entries(byPayer).sort((a,b)=>kSum(b[1])-kSum(a[1]) || b[1].length-a[1].length);
  document.getElementById("hospPayers").innerHTML = list.length && !(groups.length===1 && groups[0][0]==="")
    ? groups.map(([k,g])=>'<button type="button" class="payer-pill'+(k?'':' none')+'" data-payer="'+escapeHtml(k)+'"><b>'+escapeHtml(k ? payerLabel(k) : "بدون جهة")+'</b><span dir="ltr">'+hospText(g)+'</span></button>').join("")
    : "";
  document.getElementById("hospPayers").onclick = e=>{
    const b = e.target.closest("[data-payer]"); if(!b) return;
    const k = b.dataset.payer;
    openHospList((k ? payerLabel(k) : "بدون جهة")+' · '+fmtMonth(hospMonth), list.filter(x=>(x.payer||"")===k), true);
  };
  const el = document.getElementById("hospList");
  if(procReady===false){ el.innerHTML = '<div class="card fsetup">Hospital work can\'t be loaded right now. Reload the page to try again.</div>'; return; }
  if(!list.length){ el.innerHTML = '<div class="card empty">No operations in '+name+'. Tap “+ Add act” to add one.</div>'; return; }
  el.innerHTML = hospDays(list);
  el.onclick = e=>{ const r = e.target.closest("[data-proc]"); if(r) openHospModal(procedures.find(x=>x.id===r.dataset.proc)); };
}

function openHospModal(entry){
  const isEdit = !!entry, root = document.getElementById("modalRoot");
  const custom = [...new Set(procedures.map(x=>x.procedure).filter(n=>!HOSP_PRESETS.includes(n) && !HOSP_OLD[String(n).toLowerCase()]))];
  const hosps = [...new Set(procedures.map(x=>x.hospital).filter(Boolean))];
  const v = entry || {date:iso(new Date()), procedure:"", patientName:"", hospital:DEFAULT_HOSPITAL, payer:"", amount:"", notes:""};
  const known = HOSP_PRESETS.includes(v.procedure) ? v.procedure : HOSP_OLD[String(v.procedure).toLowerCase()] || "";
  const act = known || (v.procedure ? "other" : "");
  root.innerHTML = '<div class="overlay" id="ovH"><div class="modal"><button class="close" id="closeH" aria-label="Close">×</button>'

// ---- Finance: one page per month, like his spreadsheet ----
// Money in = his account at the start of the month + what the app already knows (clinic, hospital, outside clinics) + lines he adds.
// Money out = Utilities, Home, his own lines, and Clinic rent always last. Family expenses = lines he marks "Family".
// Always paid, same amount every month unless he changes it (a new month copies last month's amount).
const FIN_FIXED = [{fixed:"utilities", name:"Utilities", amount:500}, {fixed:"home", name:"Home", amount:300}, {fixed:"rent", name:"Clinic rent", amount:400}];
const FIN_GROUP = {};   // shown together on one line
// Order of the other clinics in Money in (like his sheet). Ri3aye (typed by him) comes right after Hayaa.
const FIN_CLINICS = ["Beirut Clinic","Zahrani Clinic","Marjayoun Clinic","Heart Tests Lab"];
const FIN_RI3AYE = {fixed:"ri3aye", name:"Ri3aye"};
let finMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
let finRecs = [], finReady = null, fin = null, finTimer = null;
const finKey = d=>d.getFullYear()+"-"+pad(d.getMonth()+1);
async function loadFinance(){
  try{ finRecs = (await fetchAll("finance_months")).map(r=>({id:r.id, ...fromDb(r)})); finReady = true; }
  catch(e){ finRecs = []; finReady = false; console.warn("Finance not available:", e.message); }
}
const finNum = v=>{ const n = parseFloat(String(v??"").replace(/[$,\s]/g,"").replace(",", ".")); return isNaN(n) ? 0 : n; };
// The month being edited. A month never opened before starts with last month's line names (amounts empty;
// Utilities, Home and Clinic rent keep last month's amount). Income lines with "auto" are his changes to an app line.
function finFor(key){
  const rec = finRecs.find(x=>x.month===key);
  const withRi3aye = list=>{   // a line he named "Ri3aye" himself becomes the fixed one
    if(list.some(l=>l.fixed==="ri3aye")) return list;
    const own = list.find(l=>!l.auto && String(l.name||"").trim().toLowerCase()==="ri3aye");
    return own ? list.map(l=>l===own ? {...l, ...FIN_RI3AYE} : l) : [{...FIN_RI3AYE, amount:""}, ...list];
  };
  if(rec) return {id:rec.id, month:key, account:rec.account===""?"":rec.account, income:withRi3aye(Array.isArray(rec.income)?rec.income:[]), expenses:finExpenses(rec.expenses), saved:true};
  const prev = finRecs.filter(x=>x.month<key).sort((a,b)=>b.month.localeCompare(a.month))[0];
  return {id:uid(), month:key, account:"",
    income:withRi3aye((prev && Array.isArray(prev.income) ? prev.income : []).filter(l=>!l.auto).map(l=>({...l, amount:"", paid:false}))),
    expenses:finExpenses(prev ? prev.expenses : []).map(l=>({...l, amount: l.fixed ? l.amount : ""})), saved:false, prev};
}
function finExpenses(list){   // always Utilities and Home first, Clinic rent last
  list = Array.isArray(list) ? list : [];
  const fx = k=>{ const d = FIN_FIXED.find(f=>f.fixed===k), l = list.find(x=>x.fixed===k);
    return l ? (l.amount==="" || l.amount==null ? {...l, amount:d.amount} : l) : {...d, family:false}; };
  return [fx("utilities"), fx("home"), ...list.filter(l=>!l.fixed), fx("rent")];
}
// He is paid later for most of his work: how many months back each line is counted.
// Clinic, Kaakie, Kfaroumen: same month · Hayaa: 2 months back · everything else (Hospital, SRH, lasers…): 1 month back.
const FIN_LAG = {"Clinic":0, "Network":2};
const finLag = name=>FIN_LAG[name] ?? 1;
function finSrc(key, back){
  const [y,m] = key.split("-").map(Number), d = new Date(y, m-1-back, 1), k = finKey(d);
  return {k, from:k+"-01", to:iso(new Date(d.getFullYear(), d.getMonth()+1, 0)), label:d.toLocaleDateString(__LOC,{month:"long"})};
}
// Income the app already has for this month's page (each line from the month it is paid for).
function finAuto(key){
  const nameOf = x=>FIN_GROUP[x.clinic] || clinicName(x.clinic);
  const clin = (s, pred)=>clinMoney(clinicDays.filter(x=>x.date>=s.from && x.date<=s.to && pred(x)));
  const line = (name, fn)=>{ const s = finSrc(key, finLag(name)); return {name, amount:fn(s), src:s.label}; };
  const lines = [
    line("Clinic", s=>appts.filter(a=>a.paid && a.date.startsWith(s.k)).reduce((t,a)=>t+(a.amount||0),0)),
    line("Hospital", s=>kSum(hospIn(s.from,s.to))*K_VALUE_USD),
    line("Network", s=>clin(s, x=>clinicGroup(x.clinic)==="hayaa")),
  ];
  const names = new Set(FIN_CLINICS);   // every clinic is listed, even at $0
  clinicDays.forEach(x=>{ if(clinicGroup(x.clinic)!=="hayaa") names.add(nameOf(x)); });
  names.forEach(n=>lines.push(line(n, s=>clin(s, x=>clinicGroup(x.clinic)!=="hayaa" && nameOf(x)===n))));
  return lines;
}
// App lines with his changes: "amount" is what counts, "app" what the app found.
function finAutoLines(key, income){
  income = Array.isArray(income) ? income : [];
  return finAuto(key).map(l=>{ const e = income.find(x=>x.auto===l.name), o = e && e.amount!=="" && e.amount!=null ? e : null;
    return {...l, app:l.amount, amount: o ? finNum(o.amount) : l.amount, edited: !!o, paid: !!(e && e.paid)}; });
}
const finOwn = income=>(Array.isArray(income) ? income : []).filter(l=>!l.auto);
// The month before (the latest earlier month he filled in), whose left over starts this month.
const finPrevRec = key=>finRecs.filter(x=>x.month<key).sort((a,b)=>b.month.localeCompare(a.month))[0];
// Totals of a month. The left over of the month before is carried in; only the first month uses "In his account".
function finCalc(key, seen){
  const rec = fin && fin.month===key ? fin : finRecs.find(x=>x.month===key); if(!rec) return null;
  seen = seen || 0; const prev = seen<240 ? finPrevRec(key) : null, p = prev ? finCalc(prev.month, seen+1) : null;
  // He can type over the carried amount (stored in "account"); empty = the calculated left over.
  const typed = rec.account!=="" && rec.account!=null, carry = p ? (typed ? finNum(rec.account) : p.left) : finNum(rec.account);
  // Only lines marked ✓ paid count (money he really received).
  const income = carry + finAutoLines(key, rec.income).filter(l=>l.paid).reduce((s,l)=>s+l.amount,0) + finOwn(rec.income).filter(l=>l.paid).reduce((s,l)=>s+finNum(l.amount),0);
  const ex = finExpenses(rec.expenses), out = ex.reduce((s,l)=>s+finNum(l.amount),0), family = ex.filter(l=>l.family).reduce((s,l)=>s+finNum(l.amount),0);
  return {carry, carryCalc: p ? p.left : null, carryEdited: !!p && typed, carryFrom: prev ? prev.month : null, income, gained:income-carry, out, left:income-out, family};
}
function finTotals(){ return finCalc(fin.month); }
const finHint = (src, edited, app)=>'for '+src+(edited ? ' · app says '+money(app) : '');
function finUnpaid(){
  return finAutoLines(fin.month, fin.income).filter(l=>!l.paid).reduce((s,l)=>s+l.amount,0)
    + finOwn(fin.income).filter(l=>!l.paid).reduce((s,l)=>s+finNum(l.amount),0);
}
function finShowTotals(){
  const t = finTotals(), set = (id,v)=>{ const el = document.getElementById(id); if(el) el.textContent = money(v); };
  finCharts();
  set("finTotIn", t.income);
  const up = finUnpaid(), ur = document.getElementById("finUnpaidRow"); if(ur){ ur.style.display = up>0 ? "" : "none"; set("finUnpaid", up); } set("finGained", t.gained); set("finCarry", t.carry); set("finTotOut", t.out); set("finLeft", t.left); set("finFamily", t.family);
  const l = document.getElementById("finLeft"); if(l) l.classList.toggle("neg", t.left<0);
}
// Donut of how a total splits (like his sheet). Max 5 colored slices + "Other"; the legend lists name, $ and %.
// Known lines keep their color every month (color follows the line, not its rank).
const FIN_SLOT = {out:{"Utilities":1, "Home":2, "Clinic rent":3}, in:{"Clinic":1, "Hospital":2, "Network":3}};
function finDonut(kind, title, lines){
  lines = lines.filter(l=>l.amount>0).sort((a,b)=>b.amount-a.amount);
  if(lines.length<2) return "";
  let top = lines.slice(0,5), rest = lines.slice(5);
  if(rest.length===1){ top.push(rest[0]); rest = []; } else if(rest.length){ top = lines.slice(0,5); }
  const total = lines.reduce((s,l)=>s+l.amount,0);
  const fixed = FIN_SLOT[kind], used = new Set(top.map(l=>fixed[l.name]).filter(Boolean));
  const free = [1,2,3,4,5].filter(n=>!used.has(n));
  const segs = top.map(l=>({...l, slot: fixed[l.name] && fixed[l.name]<=5 ? fixed[l.name] : free.shift()}));
  if(rest.length) segs.push({name:"Other", amount:rest.reduce((s,l)=>s+l.amount,0), slot:0, other:rest.map(l=>l.name).join(", ")});
  const R = 52, C = 2*Math.PI*R, gap = segs.length>1 ? 2 : 0;
  let at = 0;
  const arcs = segs.map((s,i)=>{ const len = s.amount/total*C, d = Math.max(len-gap, .5);
    const a = '<circle class="fdn-seg" data-i="'+i+'" r="'+R+'" cx="70" cy="70" fill="none" stroke="var(--s'+s.slot+')" stroke-width="20" stroke-dasharray="'+d+' '+(C-d)+'" stroke-dashoffset="'+(-at)+'" transform="rotate(-90 70 70)"><title>'+escapeHtml(s.name)+': '+money(s.amount)+' ('+Math.round(s.amount/total*100)+'%)</title></circle>';
    at += len; return a; }).join("");
  const pct = s=>Math.round(s.amount/total*100)+"%";
  return '<div class="fdn" data-kind="'+kind+'"><div class="fdn-t">'+title+'</div><div class="fdn-body">'
    +'<svg viewBox="0 0 140 140" class="fdn-svg" role="img" aria-label="'+title+'">'+arcs
    +'<text x="70" y="66" text-anchor="middle" class="fdn-c1" data-c1 data-total="'+money(total)+'">'+money(total)+'</text><text x="70" y="84" text-anchor="middle" class="fdn-c2" data-c2>total</text></svg>'
    +'<div class="fdn-leg">'+segs.map((s,i)=>'<button type="button" class="fdn-row" data-i="'+i+'"'+(s.other?' title="'+escapeHtml(s.other)+'"':'')+'><i style="background:var(--s'+s.slot+')"></i><span>'+escapeHtml(s.name)+'</span><b>'+money(s.amount)+'</b><small>'+pct(s)+'</small></button>').join("")+'</div>'
    +'</div><script type="application/json" class="fdn-data">'+JSON.stringify(segs.map(s=>({n:s.name, a:money(s.amount), p:pct(s)}))).replace(/</g,"\\u003c")+'<\/script></div>';
}
function finCharts(){
  const box = document.getElementById("finCharts"); if(!box) return;
  const inLines = [...finAutoLines(fin.month, fin.income).filter(l=>l.paid), ...finOwn(fin.income).filter(l=>l.paid).map(l=>({name:l.name||"Other income", amount:finNum(l.amount)}))];
  const outLines = fin.expenses.map(l=>({name:l.name||"Other expense", amount:finNum(l.amount)}));
  box.innerHTML = finDonut("out","Where the money goes",outLines) + finDonut("in","Where the money comes from",inLines);
  box.style.display = box.innerHTML ? "" : "none";
}
// Tap (or hover) a slice or a legend row: the center shows that line.
function finChartPick(e){
  const t = e.target.closest("[data-i]"), dn = e.target.closest(".fdn"); if(!dn) return;
  const data = JSON.parse(dn.querySelector(".fdn-data").textContent), c1 = dn.querySelector("[data-c1]"), c2 = dn.querySelector("[data-c2]");
  dn.querySelectorAll("[data-i]").forEach(x=>x.classList.toggle("dim", !!t && x.dataset.i!==t.dataset.i));
  if(t){ const d = data[+t.dataset.i]; c1.textContent = d.a; c2.textContent = d.p+" · "+d.n.slice(0,14); }
  else { c1.textContent = c1.dataset.total; c2.textContent = "total"; }
}
function finSave(){
  clearTimeout(finTimer);
  finTimer = setTimeout(async()=>{
    const f = fin, o = {month:f.month, account:f.account===""?null:finNum(f.account),
      income:f.income.map(l=>({...l, amount:l.amount===""?"":finNum(l.amount)})),
      expenses:f.expenses.map(l=>({...l, amount:l.amount===""?"":finNum(l.amount)})), updatedAt:Date.now()};
    try{
      if(f.saved) await db.doc("finance_months/"+f.id).update(o);
      else { await db.doc("finance_months/"+f.id).set(o); f.saved = true; }
      const i = finRecs.findIndex(x=>x.id===f.id); const rec = {id:f.id, ...o, account:o.account??""};
      if(i<0) finRecs.push(rec); else finRecs[i] = rec;
      const st = document.getElementById("finSaved"); if(st){ st.textContent = "Saved ✓"; setTimeout(()=>{ if(st.textContent==="Saved ✓") st.textContent = ""; }, 1500); }
    }catch(e){}
  }, 700);
}
const finAmt = (v, attrs, ph)=>'<input class="fin-amt" type="text" inputmode="decimal" autocomplete="off" placeholder="'+(ph||"$0")+'" '+attrs+' value="'+(v===""||v==null?"":escapeHtml(String(v)))+'">';
function renderFinance(){
  const key = finKey(finMonth);
  if(!fin || fin.month!==key) fin = finFor(key);
  const el = document.getElementById("finBody");
  document.getElementById("finLabel").innerHTML = fmtMonth(finMonth)+'<small class="cnt" id="finSaved"></small>';
  if(finReady===false){ el.innerHTML = '<div class="card fsetup">Finance can\'t be loaded right now. Reload the page to try again.</div>'; return; }
  const prevAmt = (list, l)=>{ const p = fin.prev && (Array.isArray(list)?list:[]).find(x=>(l.fixed ? x.fixed===l.fixed : !x.fixed && !x.auto && x.name===l.name)); return p && p.amount!=="" ? "last month "+money(finNum(p.amount)) : ""; };
  const auto = finAutoLines(key, fin.income), prevRec = finPrevRec(key);
  const chk = (on, attr)=>'<button type="button" class="fin-paid'+(on?' on':'')+'" '+attr+' aria-pressed="'+(on?'true':'false')+'" title="Paid?" aria-label="Paid">✓</button>';
  const ri = fin.income.findIndex(l=>l.fixed==="ri3aye");
  const ri3ayeRow = ri<0 ? '' : '<div class="fin-row own'+(fin.income[ri]&&fin.income[ri].paid?' is-paid':'')+'">'+(ri<0?'':chk(fin.income[ri].paid,'data-paid-own="'+ri+'"'))+'<span>Other income <small>you type it</small></span>'+finAmt(fin.income[ri].amount,'data-in-amt="'+ri+'"', prevAmt(fin.prev&&fin.prev.income, fin.income[ri]))+'<i class="fin-x" aria-hidden="true"></i></div>';
  el.innerHTML =
    '<div class="fin-card"><div class="fin-h in">Money in</div>'
    +(prevRec ? (()=>{ const c = finCalc(key);
        return '<div class="fin-row auto carry"><span>Left over from '+parseIso(prevRec.month+"-01").toLocaleDateString(__LOC,{month:"long"})+' <small id="finCarryHint">'+(c.carryEdited ? 'changed · calculated '+money(c.carryCalc) : 'carried to this month')+'</small></span>'
          +finAmt(c.carryEdited ? fin.account : Math.round(c.carryCalc*100)/100, 'data-f="carry" data-edited="'+(c.carryEdited?1:0)+'"', money(c.carryCalc))
          +(c.carryEdited ? '<button type="button" class="fin-x" data-carry-reset aria-label="Back to the calculated amount" title="Back to the calculated amount">↺</button>' : '<i class="fin-x" aria-hidden="true"></i>')+'</div>'; })()
      : '<div class="fin-row"><span>In your account <small>start of the first month</small></span>'+finAmt(fin.account,'data-f="account"')+'<i class="fin-x" aria-hidden="true"></i></div>')
    +auto.map(l=>'<div class="fin-row auto'+(l.paid?' is-paid':'')+'">'+chk(l.paid,'data-paid-auto="'+escapeHtml(l.name)+'"')+'<span>'+escapeHtml(l.name)+' <small data-hint="'+escapeHtml(l.name)+'" data-src="'+l.src+'">'+finHint(l.src, l.edited, l.app)+'</small></span>'
      +finAmt(l.edited ? l.amount : (Math.round(l.app*100)/100), 'data-auto="'+escapeHtml(l.name)+'" data-edited="'+(l.edited?1:0)+'"', money(l.app))
      +(l.edited ? '<button type="button" class="fin-x" data-auto-reset="'+escapeHtml(l.name)+'" aria-label="Back to the app amount" title="Back to the app amount">↺</button>' : '<i class="fin-x" aria-hidden="true"></i>')+'</div>'
      +(l.name==="Network" ? ri3ayeRow : '')).join("")
    +fin.income.map((l,i)=>l.auto || l.fixed ? '' : '<div class="fin-row own'+(l.paid?' is-paid':'')+'">'+chk(l.paid,'data-paid-own="'+i+'"')+'<input class="fin-name" type="text" autocomplete="off" placeholder="Name" data-in-name="'+i+'" value="'+escapeHtml(l.name||"")+'">'
      +finAmt(l.amount,'data-in-amt="'+i+'"', prevAmt(fin.prev&&fin.prev.income, l))+'<button type="button" class="fin-x" data-in-del="'+i+'" aria-label="Remove line">×</button></div>').join("")
    +'<button type="button" class="fin-add" data-add="in">+ Add income line</button>'
    +'<div class="fin-row unpaid" id="finUnpaidRow"><span>Not paid yet <small>lines without ✓ · not counted</small></span><b id="finUnpaid"></b><i class="fin-x" aria-hidden="true"></i></div>'
    +'<div class="fin-row tot"><span>Income <small>paid ✓ lines only</small></span><b id="finTotIn"></b></div></div>'
    +'<div class="fin-card"><div class="fin-h gain">Money gained</div><div class="fin-row tot"><span>Income <small>this month only</small></span><b id="finGained"></b></div></div>'
    +'<div class="fin-card"><div class="fin-h out">Money out</div>'
    +fin.expenses.map((l,i)=>'<div class="fin-row own'+(l.fixed?' fixed':'')+'">'
      +(l.fixed ? '<span>'+escapeHtml(l.name)+'</span>' : '<input class="fin-name" type="text" autocomplete="off" placeholder="Name" data-ex-name="'+i+'" value="'+escapeHtml(l.name||"")+'">')
      +'<button type="button" class="fin-fam'+(l.family?' on':'')+'" data-ex-fam="'+i+'" title="Expense on you / your family">Family</button>'
      +finAmt(l.amount,'data-ex-amt="'+i+'"', prevAmt(fin.prev&&fin.prev.expenses, l))
      +(l.fixed ? '<i class="fin-x" aria-hidden="true"></i>' : '<button type="button" class="fin-x" data-ex-del="'+i+'" aria-label="Remove line">×</button>')+'</div>'
      ).join("")
    +'<button type="button" class="fin-add" data-add="ex">+ Add expense</button>'
    +'<div class="fin-row tot"><span>Total expenses</span><b id="finTotOut"></b></div></div>'
    +'<div class="fin-card"><div class="fin-h gain">Money left over</div><div class="fin-row tot"><span>Income minus expenses</span><b id="finLeft"></b></div>'
    +'<div class="fin-row"><span>Family expenses <small>lines marked Family</small></span><b id="finFamily"></b></div></div>';
  finShowTotals();
  el.oninput = e=>{
    const t = e.target, d = t.dataset;
    if(d.f==="account") fin.account = t.value;
    else if(d.f==="carry"){   // typed over the left over of last month (empty or same = calculated amount)
      const calc = finCalc(fin.month).carryCalc, same = t.value.trim()!=="" && finNum(t.value)===Math.round(calc*100)/100;
      fin.account = t.value.trim()==="" || same ? "" : t.value; t.dataset.edited = fin.account==="" ? "0" : "1";
      const h = document.getElementById("finCarryHint"); if(h) h.textContent = fin.account==="" ? "carried to this month" : "changed · calculated "+money(calc);
    }
    else if(d.auto!==undefined){   // he changes an app line: his amount counts (empty = back to the app amount)
      const app = finAuto(fin.month).find(l=>l.name===d.auto), i = fin.income.findIndex(l=>l.auto===d.auto);
      const same = app && t.value.trim()!=="" && finNum(t.value)===Math.round(app.amount*100)/100;
      if(t.value.trim()==="" || same){ if(i>=0){ if(fin.income[i].paid) fin.income[i].amount = ""; else fin.income.splice(i,1); } }
      else if(i>=0) fin.income[i].amount = t.value; else fin.income.push({auto:d.auto, amount:t.value});
      const h = el.querySelector('[data-hint="'+CSS.escape(d.auto)+'"]');
      if(h) h.textContent = finHint(h.dataset.src, !(t.value.trim()==="" || same), app ? app.amount : 0);
      t.dataset.edited = t.value.trim()==="" || same ? "0" : "1";
    }
    else if(d.inName!==undefined) fin.income[+d.inName].name = t.value;
    else if(d.inAmt!==undefined) fin.income[+d.inAmt].amount = t.value;
    else if(d.exName!==undefined) fin.expenses[+d.exName].name = t.value;
    else if(d.exAmt!==undefined) fin.expenses[+d.exAmt].amount = t.value;
    else return;
    finShowTotals(); finSave();
  };
  el.onclick = e=>{
    const b = e.target.closest("button"); if(!b) return; const d = b.dataset;
    if(d.carryReset!==undefined){ fin.account = ""; }
    else if(d.autoReset!==undefined){ fin.income = fin.income.flatMap(l=>l.auto!==d.autoReset ? [l] : l.paid ? [{...l, amount:""}] : []); }
    else if(d.paidAuto!==undefined || d.paidOwn!==undefined){   // ✓ = this line has been paid
      let l = d.paidOwn!==undefined ? fin.income[+d.paidOwn] : fin.income.find(x=>x.auto===d.paidAuto);
      if(!l){ l = {auto:d.paidAuto, amount:""}; fin.income.push(l); }
      l.paid = !l.paid; b.classList.toggle("on", l.paid); b.setAttribute("aria-pressed", l.paid); b.closest(".fin-row").classList.toggle("is-paid", l.paid);
      finShowTotals(); finSave(); return;
    }
    else if(d.add==="in"){ fin.income.push({name:"", amount:""}); }
    else if(d.add==="ex"){ fin.expenses.splice(fin.expenses.length-1, 0, {name:"", amount:"", family:false}); }   // before Clinic rent
    else if(d.inDel!==undefined){ if(!confirm("Remove this line?")) return; fin.income.splice(+d.inDel,1); }
    else if(d.exDel!==undefined){ if(!confirm("Remove this line?")) return; fin.expenses.splice(+d.exDel,1); }
    else if(d.exFam!==undefined){ const l = fin.expenses[+d.exFam]; l.family = !l.family; b.classList.toggle("on", l.family); finShowTotals(); finSave(); return; }
    else return;
    renderFinance(); finSave();
    if(d.add){ const ins = el.querySelectorAll(d.add==="in" ? "[data-in-name]" : "[data-ex-name]"); const n = ins[ins.length-1]; if(n) n.focus(); }
  };
}

// ---- Date picker: the forms' date fields open this Monday-first calendar instead of the phone's own one ----
function openDatePick(input){
  let root = document.getElementById("dpRoot");
  if(!root){ root = document.createElement("div"); root.id = "dpRoot"; document.body.appendChild(root); }
  const sel = input.value, today = iso(new Date());
  let month = sel ? parseIso(sel) : new Date(); month = new Date(month.getFullYear(), month.getMonth(), 1);
  const close = ()=>{ root.innerHTML = ""; };
  const pick = d=>{ input.value = d; input.dispatchEvent(new Event("input",{bubbles:true})); input.dispatchEvent(new Event("change",{bubbles:true})); close(); };
  const draw = ()=>{
    const start = mondayOf(month), days = [];
    for(let d = start; d<=new Date(month.getFullYear(), month.getMonth()+1, 0) || days.length%7; d = addDays(d,1)) days.push(d);
    root.innerHTML = '<div class="overlay sheet-ov" id="ovDP"><div class="modal sheet"><button class="close" id="closeDP" aria-label="Close">×</button>'
      +'<div class="dp-h"><button type="button" data-mv="-1" aria-label="Previous month">‹</button><span>'+fmtMonth(month)+'</span><button type="button" data-mv="1" aria-label="Next month">›</button></div>'
      +'<div class="dp-g">'+DOW.map(x=>'<span>'+x+'</span>').join("")
      +days.map(d=>{ const k = iso(d), out = d.getMonth()!==month.getMonth();
        return '<button type="button" data-d="'+k+'" class="'+(k===sel?'sel':k===today?'today':'')+'"'+(out?' style="opacity:.35"':'')+'>'+d.getDate()+'</button>'; }).join("")+'</div>'
      +'<div class="dp-foot"><button type="button" class="btn secondary" data-d="'+today+'">Today</button><button type="button" class="btn secondary" data-d="'+iso(addDays(new Date(),-1))+'">Yesterday</button></div>'
      +'</div></div>';
  };
  draw();
  root.onclick = e=>{
    if(e.target.id==="ovDP" || e.target.closest("#closeDP")) return close();
    const mv = e.target.closest("[data-mv]"); if(mv){ month = new Date(month.getFullYear(), month.getMonth() + +mv.dataset.mv, 1); return draw(); }
    const b = e.target.closest("[data-d]"); if(b) pick(b.dataset.d);
  };
}
document.addEventListener("click", e=>{ const w = e.target.closest(".dpick"); if(w){ e.preventDefault(); openDatePick(w.querySelector("input")); } });
